name: hm_design
description: "Design system v2 (BOLT-0021): tokens (§10.3), light/dark/high-contrast themes, gamified widgets, bundled Nunito font."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  material_ui: ^1.7.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Bauhaus SVG art (BOLT-0110): hand-written, each file under 10 KB. Use HmArt, never paths.
  assets:
    - assets/svg/
    # Mascot and illustrations cut from the design/ui/ mock-ups by tools/design/crop-ui.mjs (BOLT-0117).
    - assets/img/
  # Bundled so the app works offline; never fetched at runtime (BOLT-0021). Licence: assets/fonts/OFL.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
