# On merge to main: build images -> deploy STAGING -> smoke + k6 quick -> manual Promote -> PRODUCTION (blueprint §42).
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: server (api, realtime, worker, scheduler)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { file: infra/docker/server.Dockerfile, target: runtime, push: true, tags: "ghcr.io/heymey/server:${{ github.sha }}" }
      - name: migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { file: infra/docker/server.Dockerfile, target: migrator, push: true, tags: "ghcr.io/heymey/migrator:${{ github.sha }}" }
      - name: marketing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { file: infra/docker/marketing.Dockerfile, push: true, tags: "ghcr.io/heymey/marketing:${{ github.sha }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, cache: true }
      - name: desk (flutter web)
        run: |
          flutter pub get
          cd apps/desk && flutter build web --release --no-web-resources-cdn
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., file: infra/docker/desk.Dockerfile, push: true, tags: "ghcr.io/heymey/desk:${{ github.sha }}" }

  staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: deploy to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }} # SHA256 of the VPS host key: refuse an impostor host (SEC-L4)
          script: cd /srv/heymey && git fetch --depth=1 origin ${{ github.sha }} && git checkout ${{ github.sha }} && infra/scripts/deploy.sh staging ${{ github.sha }}
      - name: smoke
        # staging-api is ops-allowlist-only (SEC-L1); the pipeline passes the edge key (Caddyfile staging_only).
        env: { STAGING_ACCESS_KEY: "${{ secrets.STAGING_ACCESS_KEY }}" }
        run: |
          curl -fsS -H "X-HeyMey-Staging-Key: $STAGING_ACCESS_KEY" https://staging-api.heymey.app/v1/health
      - name: k6 quick load test
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1
        with: { path: infra/k6/quick.js }
        env: { BASE_URL: "https://staging-api.heymey.app", STAGING_ACCESS_KEY: "${{ secrets.STAGING_ACCESS_KEY }}" }

  production:
    needs: staging
    runs-on: ubuntu-latest
    # "Promote" button: the `production` environment requires the founder's approval in GitHub settings.
    environment: production
    steps:
      - name: deploy to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }} # SHA256 of the VPS host key: refuse an impostor host (SEC-L4)
          script: cd /srv/heymey && git fetch --depth=1 origin ${{ github.sha }} && git checkout ${{ github.sha }} && infra/scripts/deploy.sh production ${{ github.sha }}
      - name: smoke
        run: curl -fsS https://api.heymey.app/v1/health
