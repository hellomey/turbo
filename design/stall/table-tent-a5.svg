<?xml version="1.0" encoding="UTF-8"?>
<!-- HeyMey A5 table tent face. Trim 148 x 210 mm, bleed 3 mm each side, document 154 x 216 mm. 1 unit = 1 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" width="154mm" height="216mm" viewBox="-3 -3 154 216">
<rect x="-3" y="-3" width="154" height="216" fill="#FAF6EE"/>
<text x="74" y="26" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="13" fill="#111111" text-anchor="middle">Light your first lamp</text>
<circle cx="24" cy="50" r="10" fill="#D7261E" stroke="#111111" stroke-width="1.5"/>
<text x="42" y="54" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="11" fill="#111111" text-anchor="start">1. Scan</text>
<polygon points="24,70 35,90 13,90" fill="#F5C518" stroke="#111111" stroke-width="1.5"/>
<text x="42" y="84" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="11" fill="#111111" text-anchor="start">2. Play 60 seconds</text>
<rect x="14" y="100" width="20" height="20" fill="#1F4FA3" stroke="#111111" stroke-width="1.5"/>
<text x="42" y="114" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="11" fill="#111111" text-anchor="start">3. Get a sticker</text>
<g id="QR-PLACEHOLDER" data-url="https://heymey.app/try?src=table">
<rect x="39" y="132" width="70" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
<rect x="44.6" y="137.6" width="14" height="14" fill="none" stroke="#111111" stroke-width="2"/><rect x="48.800000000000004" y="141.79999999999998" width="5.6000000000000005" height="5.6000000000000005" fill="#111111"/><rect x="89.4" y="137.6" width="14" height="14" fill="none" stroke="#111111" stroke-width="2"/><rect x="93.60000000000001" y="141.79999999999998" width="5.6000000000000005" height="5.6000000000000005" fill="#111111"/><rect x="44.6" y="182.4" width="14" height="14" fill="none" stroke="#111111" stroke-width="2"/><rect x="48.800000000000004" y="186.6" width="5.6000000000000005" height="5.6000000000000005" fill="#111111"/>
<text x="74" y="165.6" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="4.9" fill="#D7261E" text-anchor="middle">QR PLACEHOLDER</text>
<text x="74" y="172.6" font-family="Nunito, Arial, sans-serif" font-weight="700" font-size="2.8000000000000003" fill="#111111" text-anchor="middle">https://heymey.app/try?src=table</text>
</g>
<text x="74" y="208" font-family="Nunito, Arial, sans-serif" font-weight="700" font-size="4.2" fill="#111111" text-anchor="middle">Stickers are for visitors who light a lamp in the app. HeyMey is in beta.</text>
<g id="trim-guide" display="none"><rect x="0" y="0" width="148" height="210" fill="none" stroke="#00AEEF" stroke-width="0.5"/></g>
</svg>
