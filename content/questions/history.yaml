questions:
  # Harappan (Indus Valley) Civilisation
  - id: 5e000000-0201-4000-8000-000000000001
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 1
    stem: "The Great Bath was found at which Harappan site?"
    options:
      - { id: a, text: "Harappa" }
      - { id: b, text: "Lothal" }
      - { id: c, text: "Mohenjo-daro" }
      - { id: d, text: "Kalibangan" }
    correct: c
    explanation: "The Great Bath, a large brick-lined tank, was found at Mohenjo-daro in Sindh."
  - id: 5e000000-0201-4000-8000-000000000002
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "A dockyard of the Harappan period was found at:"
    options:
      - { id: a, text: "Lothal" }
      - { id: b, text: "Harappa" }
      - { id: c, text: "Mohenjo-daro" }
      - { id: d, text: "Banawali" }
    correct: a
    explanation: "Lothal in Gujarat has a brick dockyard, showing that Harappans traded by sea."
  - id: 5e000000-0201-4000-8000-000000000003
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Who first excavated Harappa in 1921?"
    options:
      - { id: a, text: "R. D. Banerji" }
      - { id: b, text: "Mortimer Wheeler" }
      - { id: c, text: "James Prinsep" }
      - { id: d, text: "Daya Ram Sahni" }
    correct: d
    explanation: "Daya Ram Sahni excavated Harappa in 1921. R. D. Banerji excavated Mohenjo-daro in 1922."
  - id: 5e000000-0201-4000-8000-000000000004
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Mohenjo-daro was first excavated in 1922 by:"
    options:
      - { id: a, text: "Daya Ram Sahni" }
      - { id: b, text: "R. D. Banerji" }
      - { id: c, text: "Alexander Cunningham" }
      - { id: d, text: "John Marshall" }
    correct: b
    explanation: "R. D. Banerji began excavations at Mohenjo-daro in 1922."
  - id: 5e000000-0201-4000-8000-000000000005
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 1
    stem: "The Harappan civilisation belongs to which age?"
    options:
      - { id: a, text: "Iron Age" }
      - { id: b, text: "Old Stone Age" }
      - { id: c, text: "Bronze Age" }
      - { id: d, text: "New Stone Age" }
    correct: c
    explanation: "Harappans used copper and bronze but not iron, so it is a Bronze Age civilisation."
  - id: 5e000000-0201-4000-8000-000000000006
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 1
    stem: "Bronze is an alloy of copper and:"
    options:
      - { id: a, text: "tin" }
      - { id: b, text: "iron" }
      - { id: c, text: "zinc" }
      - { id: d, text: "silver" }
    correct: a
    explanation: "Bronze is made by mixing copper with tin. Harappans used it for tools and figures."
  - id: 5e000000-0201-4000-8000-000000000007
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "The bronze 'dancing girl' figure was found at:"
    options:
      - { id: a, text: "Lothal" }
      - { id: b, text: "Dholavira" }
      - { id: c, text: "Kalibangan" }
      - { id: d, text: "Mohenjo-daro" }
    correct: d
    explanation: "The famous bronze dancing girl was found at Mohenjo-daro."
  - id: 5e000000-0201-4000-8000-000000000008
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Evidence of a ploughed field was found at which Harappan site in Rajasthan?"
    options:
      - { id: a, text: "Rakhigarhi" }
      - { id: b, text: "Kalibangan" }
      - { id: c, text: "Lothal" }
      - { id: d, text: "Chanhudaro" }
    correct: b
    explanation: "Kalibangan in Rajasthan shows furrows of a ploughed field and fire altars."
  - id: 5e000000-0201-4000-8000-000000000009
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Harappa is on the bank of which river?"
    options:
      - { id: a, text: "Ravi" }
      - { id: b, text: "Indus" }
      - { id: c, text: "Sutlej" }
      - { id: d, text: "Ghaggar" }
    correct: a
    explanation: "Harappa lies on the Ravi in Punjab, Pakistan. Mohenjo-daro lies on the Indus in Sindh."
  - id: 5e000000-0201-4000-8000-000000000010
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 1
    stem: "What is true about the Harappan script today?"
    options:
      - { id: a, text: "It was deciphered by James Prinsep" }
      - { id: b, text: "It is the same as Brahmi" }
      - { id: c, text: "It has not yet been deciphered" }
      - { id: d, text: "It was written only on copper plates" }
    correct: c
    explanation: "No one has been able to read the Harappan script so far. Prinsep deciphered Brahmi, a much later script."
  - id: 5e000000-0201-4000-8000-000000000011
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Which Harappan site in Gujarat is known for its water management and was made a UNESCO World Heritage Site?"
    options:
      - { id: a, text: "Lothal" }
      - { id: b, text: "Surkotada" }
      - { id: c, text: "Banawali" }
      - { id: d, text: "Dholavira" }
    correct: d
    explanation: "Dholavira in Kutch, Gujarat, had reservoirs and channels to store water. It was inscribed as a World Heritage Site in 2021."
  - id: 5e000000-0201-4000-8000-000000000012
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Harappan towns were laid out in a:"
    options:
      - { id: a, text: "circular pattern around a temple" }
      - { id: b, text: "grid pattern with roads crossing at right angles" }
      - { id: c, text: "random pattern without roads" }
      - { id: d, text: "single long street along the river" }
    correct: b
    explanation: "Harappan towns had planned roads that crossed at right angles, dividing the town into blocks."
  - id: 5e000000-0201-4000-8000-000000000013
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Which metal was NOT known to the Harappans?"
    options:
      - { id: a, text: "Copper" }
      - { id: b, text: "Gold" }
      - { id: c, text: "Iron" }
      - { id: d, text: "Bronze" }
    correct: c
    explanation: "Iron came into use in India much later. Harappans used copper, bronze, gold and silver."
  - id: 5e000000-0201-4000-8000-000000000014
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "The Harappans are believed to be among the earliest people to grow:"
    options:
      - { id: a, text: "cotton" }
      - { id: b, text: "tea" }
      - { id: c, text: "coffee" }
      - { id: d, text: "rubber" }
    correct: a
    explanation: "Harappans grew cotton and wove cloth, among the earliest known in the world."
  - id: 5e000000-0201-4000-8000-000000000015
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Harappan houses and drains were mostly built with:"
    options:
      - { id: a, text: "stone blocks" }
      - { id: b, text: "wood" }
      - { id: c, text: "bamboo" }
      - { id: d, text: "burnt bricks" }
    correct: d
    explanation: "Harappans used burnt bricks of standard size for houses, walls and covered drains."
  - id: 5e000000-0201-4000-8000-000000000016
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 3
    stem: "Who was the Director-General of the Archaeological Survey of India when Harappa and Mohenjo-daro were excavated?"
    options:
      - { id: a, text: "Alexander Cunningham" }
      - { id: b, text: "John Marshall" }
      - { id: c, text: "Mortimer Wheeler" }
      - { id: d, text: "James Prinsep" }
    correct: b
    explanation: "Sir John Marshall headed the ASI in the 1920s and announced the discovery of the Indus civilisation in 1924."
  - id: 5e000000-0201-4000-8000-000000000017
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Which animal appears most often on Harappan seals?"
    options:
      - { id: a, text: "Horse" }
      - { id: b, text: "Lion" }
      - { id: c, text: "Unicorn-like bull" }
      - { id: d, text: "Camel" }
    correct: c
    explanation: "A one-horned, unicorn-like animal is the most common motif on Harappan seals."
  - id: 5e000000-0201-4000-8000-000000000018
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 3
    stem: "Most Harappan seals were made of:"
    options:
      - { id: a, text: "steatite" }
      - { id: b, text: "iron" }
      - { id: c, text: "glass" }
      - { id: d, text: "ivory" }
    correct: a
    explanation: "Most seals were carved from steatite, a soft stone, and then hardened by heating."
  - id: 5e000000-0201-4000-8000-000000000019
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 3
    stem: "Rakhigarhi, one of the largest Harappan sites in India, is in which state?"
    options:
      - { id: a, text: "Gujarat" }
      - { id: b, text: "Rajasthan" }
      - { id: c, text: "Punjab" }
      - { id: d, text: "Haryana" }
    correct: d
    explanation: "Rakhigarhi is in the Hisar district of Haryana."
  - id: 5e000000-0201-4000-8000-000000000020
    topic_id: 0199f5a0-0201-7000-8000-000000000201
    difficulty: 2
    stem: "Mohenjo-daro is located in which present-day region?"
    options:
      - { id: a, text: "Punjab, India" }
      - { id: b, text: "Sindh, Pakistan" }
      - { id: c, text: "Gujarat, India" }
      - { id: d, text: "Balochistan, Afghanistan" }
    correct: b
    explanation: "Mohenjo-daro lies on the Indus in the Sindh province of Pakistan."

  # The Mauryan Empire
  - id: 5e000000-0202-4000-8000-000000000001
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 1
    stem: "Who founded the Mauryan Empire?"
    options:
      - { id: a, text: "Ashoka" }
      - { id: b, text: "Bindusara" }
      - { id: c, text: "Chandragupta Maurya" }
      - { id: d, text: "Bimbisara" }
    correct: c
    explanation: "Chandragupta Maurya founded the empire after overthrowing the Nandas, with Chanakya as his adviser."
  - id: 5e000000-0202-4000-8000-000000000002
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 1
    stem: "The Arthashastra is credited to:"
    options:
      - { id: a, text: "Kautilya" }
      - { id: b, text: "Megasthenes" }
      - { id: c, text: "Kalidasa" }
      - { id: d, text: "Vishakhadatta" }
    correct: a
    explanation: "The Arthashastra, a treatise on statecraft and economy, is credited to Kautilya, also called Chanakya."
  - id: 5e000000-0202-4000-8000-000000000003
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Megasthenes, author of Indica, was the ambassador of:"
    options:
      - { id: a, text: "Alexander" }
      - { id: b, text: "Darius" }
      - { id: c, text: "Ptolemy" }
      - { id: d, text: "Seleucus Nicator" }
    correct: d
    explanation: "Seleucus Nicator sent Megasthenes to the court of Chandragupta Maurya at Pataliputra."
  - id: 5e000000-0202-4000-8000-000000000004
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 1
    stem: "What was the capital of the Mauryan Empire?"
    options:
      - { id: a, text: "Ujjain" }
      - { id: b, text: "Pataliputra" }
      - { id: c, text: "Taxila" }
      - { id: d, text: "Kanchipuram" }
    correct: b
    explanation: "Pataliputra, near modern Patna in Bihar, was the Mauryan capital."
  - id: 5e000000-0202-4000-8000-000000000005
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 1
    stem: "Which war made Ashoka give up conquest by force?"
    options:
      - { id: a, text: "Battle of Panipat" }
      - { id: b, text: "Battle of Hydaspes" }
      - { id: c, text: "Kalinga war" }
      - { id: d, text: "Battle of Takkolam" }
    correct: c
    explanation: "The great loss of life in the Kalinga war led Ashoka to turn to Dhamma."
  - id: 5e000000-0202-4000-8000-000000000006
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Kalinga corresponds roughly to which present-day state?"
    options:
      - { id: a, text: "Odisha" }
      - { id: b, text: "Bihar" }
      - { id: c, text: "Gujarat" }
      - { id: d, text: "Kerala" }
    correct: a
    explanation: "Ancient Kalinga lay on the east coast, in present-day Odisha."
  - id: 5e000000-0202-4000-8000-000000000007
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Most of Ashoka's edicts are written in which script?"
    options:
      - { id: a, text: "Devanagari" }
      - { id: b, text: "Grantha" }
      - { id: c, text: "Tamil" }
      - { id: d, text: "Brahmi" }
    correct: d
    explanation: "Most Ashokan edicts use the Brahmi script. A few in the north-west use Kharosthi, Greek or Aramaic."
  - id: 5e000000-0202-4000-8000-000000000008
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Who deciphered the Brahmi script in 1837?"
    options:
      - { id: a, text: "William Jones" }
      - { id: b, text: "James Prinsep" }
      - { id: c, text: "John Marshall" }
      - { id: d, text: "Max Muller" }
    correct: b
    explanation: "James Prinsep deciphered Brahmi in 1837, which made Ashoka's edicts readable."
  - id: 5e000000-0202-4000-8000-000000000009
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 1
    stem: "India's national emblem is taken from the Ashokan pillar at:"
    options:
      - { id: a, text: "Sanchi" }
      - { id: b, text: "Lumbini" }
      - { id: c, text: "Sarnath" }
      - { id: d, text: "Bodh Gaya" }
    correct: c
    explanation: "The national emblem is adapted from the Lion Capital of the Ashokan pillar at Sarnath."
  - id: 5e000000-0202-4000-8000-000000000010
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Ashoka sent his son Mahendra and daughter Sanghamitra to spread Buddhism in:"
    options:
      - { id: a, text: "Sri Lanka" }
      - { id: b, text: "China" }
      - { id: c, text: "Egypt" }
      - { id: d, text: "Greece" }
    correct: a
    explanation: "Mahendra and Sanghamitra carried Buddhism to Sri Lanka."
  - id: 5e000000-0202-4000-8000-000000000011
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Who was the son and successor of Chandragupta Maurya?"
    options:
      - { id: a, text: "Ashoka" }
      - { id: b, text: "Brihadratha" }
      - { id: c, text: "Dasaratha" }
      - { id: d, text: "Bindusara" }
    correct: d
    explanation: "Bindusara succeeded Chandragupta. Ashoka was Bindusara's son."
  - id: 5e000000-0202-4000-8000-000000000012
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Where did Chandragupta Maurya spend his last days as a Jain, according to Jain tradition?"
    options:
      - { id: a, text: "Pawapuri" }
      - { id: b, text: "Shravanabelagola" }
      - { id: c, text: "Madurai" }
      - { id: d, text: "Mount Abu" }
    correct: b
    explanation: "Jain tradition says Chandragupta went to Shravanabelagola in present-day Karnataka with the monk Bhadrabahu."
  - id: 5e000000-0202-4000-8000-000000000013
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 3
    stem: "Who killed the last Mauryan ruler Brihadratha and founded a new dynasty?"
    options:
      - { id: a, text: "Kanishka" }
      - { id: b, text: "Kharavela" }
      - { id: c, text: "Pushyamitra Shunga" }
      - { id: d, text: "Samudragupta" }
    correct: c
    explanation: "Pushyamitra Shunga, the Mauryan army commander, killed Brihadratha and founded the Shunga dynasty."
  - id: 5e000000-0202-4000-8000-000000000014
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "In his edicts Ashoka calls himself:"
    options:
      - { id: a, text: "Devanampiya Piyadasi" }
      - { id: b, text: "Vikramaditya" }
      - { id: c, text: "Rajaraja" }
      - { id: d, text: "Maharajadhiraja" }
    correct: a
    explanation: "Ashoka's edicts call him Devanampiya Piyadasi, meaning 'beloved of the gods, of pleasing appearance'."
  - id: 5e000000-0202-4000-8000-000000000015
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Ashoka appointed officers to spread Dhamma. What were they called?"
    options:
      - { id: a, text: "Amatyas" }
      - { id: b, text: "Rajukas" }
      - { id: c, text: "Sannidhata" }
      - { id: d, text: "Dhamma Mahamattas" }
    correct: d
    explanation: "Dhamma Mahamattas were special officers who toured the empire to spread Dhamma."
  - id: 5e000000-0202-4000-8000-000000000016
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 3
    stem: "Which Tamil kingdoms are named in Ashoka's rock edicts as neighbours outside his empire?"
    options:
      - { id: a, text: "Pallavas and Kalabhras" }
      - { id: b, text: "Cholas, Pandyas and Cheras" }
      - { id: c, text: "Hoysalas and Kakatiyas" }
      - { id: d, text: "Nayaks and Marathas" }
    correct: b
    explanation: "Ashoka's rock edicts name the Cholas, Pandyas, Cheras (Keralaputras) and Satiyaputras as independent neighbours."
  - id: 5e000000-0202-4000-8000-000000000017
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 3
    stem: "The third Buddhist Council was held during Ashoka's reign at:"
    options:
      - { id: a, text: "Rajagriha" }
      - { id: b, text: "Vaishali" }
      - { id: c, text: "Pataliputra" }
      - { id: d, text: "Kashmir" }
    correct: c
    explanation: "Buddhist tradition places the third council at Pataliputra under Ashoka's patronage."
  - id: 5e000000-0202-4000-8000-000000000018
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 3
    stem: "The play Mudrarakshasa, about Chandragupta's rise to power, was written by:"
    options:
      - { id: a, text: "Vishakhadatta" }
      - { id: b, text: "Kalidasa" }
      - { id: c, text: "Banabhatta" }
      - { id: d, text: "Kautilya" }
    correct: a
    explanation: "Vishakhadatta wrote Mudrarakshasa, which shows Chanakya's plans to bring Chandragupta to power."
  - id: 5e000000-0202-4000-8000-000000000019
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Chandragupta Maurya came to power by overthrowing which dynasty?"
    options:
      - { id: a, text: "Shunga" }
      - { id: b, text: "Gupta" }
      - { id: c, text: "Haryanka" }
      - { id: d, text: "Nanda" }
    correct: d
    explanation: "Chandragupta defeated the Nanda dynasty of Magadha with Chanakya's help."
  - id: 5e000000-0202-4000-8000-000000000020
    topic_id: 0199f5a0-0202-7000-8000-000000000202
    difficulty: 2
    stem: "Ashoka's Dhamma mainly stressed:"
    options:
      - { id: a, text: "conquest of new lands" }
      - { id: b, text: "tolerance, non-violence and respect for all" }
      - { id: c, text: "worship of a single god" }
      - { id: d, text: "strict caste rules" }
    correct: b
    explanation: "Dhamma was a moral code of tolerance, non-violence, respect for elders and care for people and animals."

  # The Delhi Sultanate
  - id: 5e000000-0203-4000-8000-000000000001
    topic_id: 0199f5a0-0203-7000-8000-000000000203
    difficulty: 1
    stem: "Who founded the Delhi Sultanate in 1206?"
    options:
      - { id: a, text: "Iltutmish" }
      - { id: b, text: "Qutb-ud-din Aibak" }
      - { id: c, text: "Balban" }
      - { id: d, text: "Muhammad Ghori" }
    correct: b
    explanation: "Qutb-ud-din Aibak, a slave general of Muhammad Ghori, founded the Sultanate and the Slave dynasty in 1206."
  - id: 5e000000-0203-4000-8000-000000000002
    topic_id: 0199f5a0-0203-7000-8000-000000000203
    difficulty: 1
    stem: "Who completed the Qutb Minar?"
    options:
      - { id: a, text: "Qutb-ud-din Aibak" }
      - { id: b, text: "Alauddin Khalji" }
      - { id: c, text: "Iltutmish" }
      - { id: d, text: "Firoz Shah Tughlaq" }
    correct: c
    explanation: "Aibak began the Qutb Minar and Iltutmish completed it."
  - id: 5e000000-0203-4000-8000-000000000003
    topic_id: 0199f5a0-0203-7000-8000-000000000203
    difficulty: 1
    stem: "Who was the only woman ruler of the Delhi Sultanate?"
    options:
      - { id: a, text: "Razia" }
      - { id: b, text: "Nur Jahan" }
      - { id: c, text: "Chand Bibi" }
      - { id: d, text: "Rani Durgavati" }
    correct: a
    explanation: "Razia, daughter of Iltutmish, was the first and only woman to rule from Delhi in the Sultanate period."
  - id: 5e000000-0203-4000-8000-000000000004
    topic_id: 0199f5a0-0203-7000-8000-000000000203
    difficulty: 2
    stem: "Which Sultan introduced the silver tanka and the copper jital?"
