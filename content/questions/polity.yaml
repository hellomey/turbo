set: polity-sample-1
review_status: sample
source:
  kind: original
  citation: "HeyMey original practice question (sample content, under review). Constitution of India, Preamble and Parts III, IV, V, IX, IXA."
  url: null
questions:
  # The Preamble
  - id: 5e000000-0101-4000-8000-000000000001
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 1
    stem: "With which words does the Preamble to the Constitution of India begin?"
    options:
      - { id: a, text: "We, the people of India" }
      - { id: b, text: "We, the citizens of Bharat" }
      - { id: c, text: "In the name of the Republic" }
      - { id: d, text: "We, the Constituent Assembly" }
    correct: a
    explanation: "The Preamble opens with 'We, the people of India', showing that the Constitution draws its authority from the people."
  - id: 5e000000-0101-4000-8000-000000000002
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Which amendment added the words 'socialist' and 'secular' to the Preamble?"
    options:
      - { id: a, text: "44th Amendment" }
      - { id: b, text: "42nd Amendment" }
      - { id: c, text: "73rd Amendment" }
      - { id: d, text: "1st Amendment" }
    correct: b
    explanation: "The 42nd Amendment of 1976 added 'socialist', 'secular' and 'integrity' to the Preamble."
  - id: 5e000000-0101-4000-8000-000000000003
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Besides 'socialist' and 'secular', which other word did the 42nd Amendment add to the Preamble?"
    options:
      - { id: a, text: "Sovereign" }
      - { id: b, text: "Republic" }
      - { id: c, text: "Integrity" }
      - { id: d, text: "Fraternity" }
    correct: c
    explanation: "The phrase 'unity of the Nation' became 'unity and integrity of the Nation' through the 42nd Amendment in 1976."
  - id: 5e000000-0101-4000-8000-000000000004
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 1
    stem: "On which date was the Constitution of India adopted by the Constituent Assembly?"
    options:
      - { id: a, text: "26 January 1950" }
      - { id: b, text: "15 August 1947" }
      - { id: c, text: "9 December 1946" }
      - { id: d, text: "26 November 1949" }
    correct: d
    explanation: "The Constitution was adopted on 26 November 1949, a date the Preamble itself records. It came into force on 26 January 1950."
  - id: 5e000000-0101-4000-8000-000000000005
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 1
    stem: "The Constitution of India came into force on which date?"
    options:
      - { id: a, text: "26 January 1950" }
      - { id: b, text: "26 November 1949" }
      - { id: c, text: "15 August 1950" }
      - { id: d, text: "2 October 1949" }
    correct: a
    explanation: "The Constitution came into force on 26 January 1950, celebrated every year as Republic Day."
  - id: 5e000000-0101-4000-8000-000000000006
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "According to the Preamble, who is the source of authority of the Constitution?"
    options:
      - { id: a, text: "The President of India" }
      - { id: b, text: "The people of India" }
      - { id: c, text: "The Parliament" }
      - { id: d, text: "The Supreme Court" }
    correct: b
    explanation: "By beginning with 'We, the people of India', the Preamble shows that the people are the source of all authority."
  - id: 5e000000-0101-4000-8000-000000000007
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "The word 'Republic' in the Preamble means that India's head of state is:"
    options:
      - { id: a, text: "a hereditary monarch" }
      - { id: b, text: "appointed by the Prime Minister" }
      - { id: c, text: "elected, not hereditary" }
      - { id: d, text: "nominated by the Supreme Court" }
    correct: c
    explanation: "A republic has an elected head of state. India's President is elected indirectly, not born into the office."
  - id: 5e000000-0101-4000-8000-000000000008
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 3
    stem: "In which case did the Supreme Court hold that the Preamble is a part of the Constitution?"
    options:
      - { id: a, text: "Berubari Union case" }
      - { id: b, text: "Golaknath case" }
      - { id: c, text: "Minerva Mills case" }
      - { id: d, text: "Kesavananda Bharati case" }
    correct: d
    explanation: "In Kesavananda Bharati (1973) the Supreme Court held that the Preamble is part of the Constitution, reversing the view taken in the Berubari case."
  - id: 5e000000-0101-4000-8000-000000000009
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Which three kinds of justice does the Preamble promise?"
    options:
      - { id: a, text: "Social, economic and political" }
      - { id: b, text: "Civil, criminal and military" }
      - { id: c, text: "Religious, cultural and social" }
      - { id: d, text: "Economic, judicial and moral" }
    correct: a
    explanation: "The Preamble secures to all citizens justice that is social, economic and political."
  - id: 5e000000-0101-4000-8000-000000000010
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Which of these is NOT listed under 'liberty' in the Preamble?"
    options:
      - { id: a, text: "Liberty of thought" }
      - { id: b, text: "Liberty of property" }
      - { id: c, text: "Liberty of belief" }
      - { id: d, text: "Liberty of worship" }
    correct: b
    explanation: "The Preamble lists liberty of thought, expression, belief, faith and worship. Property is not in that list."
  - id: 5e000000-0101-4000-8000-000000000011
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "The Preamble promises equality of:"
    options:
      - { id: a, text: "income and wealth" }
      - { id: b, text: "property and land" }
      - { id: c, text: "status and opportunity" }
      - { id: d, text: "religion and language" }
    correct: c
    explanation: "The Preamble secures equality of status and of opportunity to all citizens."
  - id: 5e000000-0101-4000-8000-000000000012
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 3
    stem: "According to the Preamble, fraternity assures the dignity of the individual and:"
    options:
      - { id: a, text: "the power of the State" }
      - { id: b, text: "the rule of the majority" }
      - { id: c, text: "freedom of trade" }
      - { id: d, text: "the unity and integrity of the Nation" }
    correct: d
    explanation: "The Preamble speaks of fraternity assuring the dignity of the individual and the unity and integrity of the Nation."
  - id: 5e000000-0101-4000-8000-000000000013
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "How many times has the Preamble been amended so far?"
    options:
      - { id: a, text: "Once" }
      - { id: b, text: "Never" }
      - { id: c, text: "Three times" }
      - { id: d, text: "Five times" }
    correct: a
    explanation: "The Preamble has been amended only once, by the 42nd Amendment in 1976."
  - id: 5e000000-0101-4000-8000-000000000014
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Who moved the Objectives Resolution in the Constituent Assembly, on which the Preamble is based?"
    options:
      - { id: a, text: "B. R. Ambedkar" }
      - { id: b, text: "Jawaharlal Nehru" }
      - { id: c, text: "Rajendra Prasad" }
      - { id: d, text: "Sardar Vallabhbhai Patel" }
    correct: b
    explanation: "Jawaharlal Nehru moved the Objectives Resolution in December 1946. Its ideas were later shaped into the Preamble."
  - id: 5e000000-0101-4000-8000-000000000015
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "Can a citizen go to court to enforce the Preamble directly?"
    options:
      - { id: a, text: "Yes, in any High Court" }
      - { id: b, text: "Yes, only in the Supreme Court" }
      - { id: c, text: "No, the Preamble is not enforceable in court" }
      - { id: d, text: "Only with the President's permission" }
    correct: c
    explanation: "The Preamble is not justiciable. Courts use it to interpret the Constitution, but it cannot be enforced on its own."
  - id: 5e000000-0101-4000-8000-000000000016
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 1
    stem: "National Constitution Day (Samvidhan Divas) is observed on which day?"
    options:
      - { id: a, text: "26 January" }
      - { id: b, text: "15 August" }
      - { id: c, text: "2 October" }
      - { id: d, text: "26 November" }
    correct: d
    explanation: "Constitution Day is observed on 26 November, the day the Constituent Assembly adopted the Constitution in 1949."
  - id: 5e000000-0101-4000-8000-000000000017
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "The word 'Sovereign' in the Preamble means India:"
    options:
      - { id: a, text: "is free to decide its internal and external affairs" }
      - { id: b, text: "has a king as head of state" }
      - { id: c, text: "has no official religion" }
      - { id: d, text: "owns all industries" }
    correct: a
    explanation: "Sovereign means India is independent and not under the control of any other country in its internal or external matters."
  - id: 5e000000-0101-4000-8000-000000000018
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 2
    stem: "The word 'secular' in the Preamble means that the State:"
    options:
      - { id: a, text: "bans all religions" }
      - { id: b, text: "treats all religions equally and has no state religion" }
      - { id: c, text: "follows the religion of the majority" }
      - { id: d, text: "funds only one religion" }
    correct: b
    explanation: "A secular State has no official religion and treats every religion equally."
  - id: 5e000000-0101-4000-8000-000000000019
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 3
    stem: "The ideals of liberty, equality and fraternity in the Preamble are commonly traced to which revolution?"
    options:
      - { id: a, text: "The American Revolution" }
      - { id: b, text: "The Russian Revolution" }
      - { id: c, text: "The French Revolution" }
      - { id: d, text: "The Industrial Revolution" }
    correct: c
    explanation: "Liberty, equality and fraternity were the slogans of the French Revolution, and textbooks trace these Preamble ideals to it."
  - id: 5e000000-0101-4000-8000-000000000020
    topic_id: 0199f5a0-0101-7000-8000-000000000101
    difficulty: 3
    stem: "Which set of words correctly describes India in the Preamble today, in order?"
    options:
      - { id: a, text: "Democratic, Sovereign, Secular, Socialist Republic" }
      - { id: b, text: "Secular, Socialist, Sovereign, Democratic Republic" }
      - { id: c, text: "Sovereign, Democratic, Socialist, Secular Republic" }
      - { id: d, text: "Sovereign, Socialist, Secular, Democratic Republic" }
    correct: d
    explanation: "The Preamble describes India as a Sovereign Socialist Secular Democratic Republic."

  # Fundamental Rights
  - id: 5e000000-0102-4000-8000-000000000001
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 1
    stem: "In which Part of the Constitution are the Fundamental Rights found?"
    options:
      - { id: a, text: "Part II" }
      - { id: b, text: "Part III" }
      - { id: c, text: "Part IV" }
      - { id: d, text: "Part IVA" }
    correct: b
    explanation: "Fundamental Rights are in Part III, Articles 12 to 35. Part IV holds the Directive Principles."
  - id: 5e000000-0102-4000-8000-000000000002
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 1
    stem: "Which Article abolishes untouchability?"
    options:
      - { id: a, text: "Article 14" }
      - { id: b, text: "Article 21" }
      - { id: c, text: "Article 17" }
      - { id: d, text: "Article 32" }
    correct: c
    explanation: "Article 17 abolishes untouchability and forbids its practice in any form."
  - id: 5e000000-0102-4000-8000-000000000003
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "B. R. Ambedkar called which Article the 'heart and soul' of the Constitution?"
    options:
      - { id: a, text: "Article 32" }
      - { id: b, text: "Article 14" }
      - { id: c, text: "Article 19" }
      - { id: d, text: "Article 44" }
    correct: a
    explanation: "Article 32, the right to constitutional remedies, lets a person go straight to the Supreme Court. Ambedkar called it the heart and soul of the Constitution."
  - id: 5e000000-0102-4000-8000-000000000004
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Which right was removed from the list of Fundamental Rights by the 44th Amendment?"
    options:
      - { id: a, text: "Right to equality" }
      - { id: b, text: "Right to freedom of religion" }
      - { id: c, text: "Right against exploitation" }
      - { id: d, text: "Right to property" }
    correct: d
    explanation: "The 44th Amendment (1978) removed the right to property from Part III. It is now a legal right under Article 300A."
  - id: 5e000000-0102-4000-8000-000000000005
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Article 21A gives free and compulsory education to children of which age group?"
    options:
      - { id: a, text: "3 to 10 years" }
      - { id: b, text: "6 to 14 years" }
      - { id: c, text: "5 to 15 years" }
      - { id: d, text: "6 to 18 years" }
    correct: b
    explanation: "Article 21A, added by the 86th Amendment in 2002, makes education free and compulsory for children aged 6 to 14."
  - id: 5e000000-0102-4000-8000-000000000006
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Which writ orders a person who has been detained to be produced before a court?"
    options:
      - { id: a, text: "Mandamus" }
      - { id: b, text: "Certiorari" }
      - { id: c, text: "Habeas corpus" }
      - { id: d, text: "Quo warranto" }
    correct: c
    explanation: "Habeas corpus means 'to have the body'. The court orders the detained person to be brought before it to check whether the detention is lawful."
  - id: 5e000000-0102-4000-8000-000000000007
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 3
    stem: "Which writ asks a person 'by what authority' they hold a public office?"
    options:
      - { id: a, text: "Quo warranto" }
      - { id: b, text: "Prohibition" }
      - { id: c, text: "Mandamus" }
      - { id: d, text: "Habeas corpus" }
    correct: a
    explanation: "Quo warranto means 'by what authority'. It stops a person from holding a public office they have no right to."
  - id: 5e000000-0102-4000-8000-000000000008
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 3
    stem: "The writ of mandamus literally means:"
    options:
      - { id: a, text: "to be certified" }
      - { id: b, text: "to have the body" }
      - { id: c, text: "by what authority" }
      - { id: d, text: "we command" }
    correct: d
    explanation: "Mandamus means 'we command'. The court orders a public official or body to perform a duty it has failed to do."
  - id: 5e000000-0102-4000-8000-000000000009
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Article 24 prohibits employing children below what age in factories, mines and hazardous work?"
    options:
      - { id: a, text: "12 years" }
      - { id: b, text: "16 years" }
      - { id: c, text: "14 years" }
      - { id: d, text: "18 years" }
    correct: c
    explanation: "Article 24 forbids employing children below 14 years in factories, mines and other hazardous work."
  - id: 5e000000-0102-4000-8000-000000000010
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Which Article protects life and personal liberty?"
    options:
      - { id: a, text: "Article 21" }
      - { id: b, text: "Article 19" }
      - { id: c, text: "Article 25" }
      - { id: d, text: "Article 15" }
    correct: a
    explanation: "Article 21 says no person shall be deprived of life or personal liberty except by procedure established by law."
  - id: 5e000000-0102-4000-8000-000000000011
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Articles 25 to 28 deal with which Fundamental Right?"
    options:
      - { id: a, text: "Right to equality" }
      - { id: b, text: "Right to freedom of religion" }
      - { id: c, text: "Cultural and educational rights" }
      - { id: d, text: "Right against exploitation" }
    correct: b
    explanation: "Articles 25 to 28 cover freedom of conscience and the free profession, practice and propagation of religion."
  - id: 5e000000-0102-4000-8000-000000000012
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Article 18 deals with:"
    options:
      - { id: a, text: "freedom of speech" }
      - { id: b, text: "protection of minorities" }
      - { id: c, text: "right to constitutional remedies" }
      - { id: d, text: "abolition of titles" }
    correct: d
    explanation: "Article 18 abolishes titles, except military and academic distinctions."
  - id: 5e000000-0102-4000-8000-000000000013
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 3
    stem: "Since the 44th Amendment, which Articles cannot be suspended even during a national emergency?"
    options:
      - { id: a, text: "Articles 14 and 15" }
      - { id: b, text: "Articles 19 and 22" }
      - { id: c, text: "Articles 20 and 21" }
      - { id: d, text: "Articles 25 and 26" }
    correct: c
    explanation: "After the 44th Amendment, the rights under Articles 20 and 21 stay in force even during a national emergency."
  - id: 5e000000-0102-4000-8000-000000000014
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 1
    stem: "Article 14 guarantees:"
    options:
      - { id: a, text: "equality before the law and equal protection of the laws" }
      - { id: b, text: "freedom of movement" }
      - { id: c, text: "right to education" }
      - { id: d, text: "freedom of religion" }
    correct: a
    explanation: "Article 14 says the State shall not deny any person equality before the law or the equal protection of the laws."
  - id: 5e000000-0102-4000-8000-000000000015
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Under which Article can a High Court issue writs?"
    options:
      - { id: a, text: "Article 32" }
      - { id: b, text: "Article 226" }
      - { id: c, text: "Article 368" }
      - { id: d, text: "Article 352" }
    correct: b
    explanation: "High Courts issue writs under Article 226. The Supreme Court issues them under Article 32."
  - id: 5e000000-0102-4000-8000-000000000016
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Article 23 prohibits:"
    options:
      - { id: a, text: "discrimination in public places" }
      - { id: b, text: "religious instruction in schools" }
      - { id: c, text: "arrest without warrant" }
      - { id: d, text: "traffic in human beings and forced labour" }
    correct: d
    explanation: "Article 23 bans human trafficking, begar and other forms of forced labour."
  - id: 5e000000-0102-4000-8000-000000000017
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Articles 29 and 30 mainly protect the interests of:"
    options:
      - { id: a, text: "government employees" }
      - { id: b, text: "farmers" }
      - { id: c, text: "minorities" }
      - { id: d, text: "foreign citizens" }
    correct: c
    explanation: "Articles 29 and 30 are cultural and educational rights. They protect the language, script and culture of minorities and let them run educational institutions."
  - id: 5e000000-0102-4000-8000-000000000018
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 3
    stem: "Article 15 prohibits discrimination on which of these grounds?"
    options:
      - { id: a, text: "Religion, race, caste, sex or place of birth" }
      - { id: b, text: "Income, education or occupation" }
      - { id: c, text: "Age, height or weight" }
      - { id: d, text: "Political party membership only" }
    correct: a
    explanation: "Article 15 forbids the State from discriminating against citizens only on grounds of religion, race, caste, sex or place of birth."
  - id: 5e000000-0102-4000-8000-000000000019
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "The idea of Fundamental Rights in the Indian Constitution was mainly borrowed from the constitution of:"
    options:
      - { id: a, text: "Ireland" }
      - { id: b, text: "the United States" }
      - { id: c, text: "Canada" }
      - { id: d, text: "Australia" }
    correct: b
    explanation: "The Bill of Rights in the US Constitution inspired India's Fundamental Rights. The Directive Principles came from Ireland."
  - id: 5e000000-0102-4000-8000-000000000020
    topic_id: 0199f5a0-0102-7000-8000-000000000102
    difficulty: 2
    stem: "Article 16 guarantees equality of opportunity in:"
    options:
      - { id: a, text: "admission to private schools" }
      - { id: b, text: "access to temples" }
      - { id: c, text: "inheritance of property" }
      - { id: d, text: "matters of public employment" }
    correct: d
    explanation: "Article 16 gives all citizens equal opportunity in matters of employment or appointment to any office under the State."

  # Directive Principles of State Policy
  - id: 5e000000-0103-4000-8000-000000000001
    topic_id: 0199f5a0-0103-7000-8000-000000000103
    difficulty: 1
    stem: "In which Part of the Constitution are the Directive Principles of State Policy?"
    options:
      - { id: a, text: "Part III" }
      - { id: b, text: "Part V" }
      - { id: c, text: "Part IV" }
      - { id: d, text: "Part IX" }
    correct: c
    explanation: "The Directive Principles are in Part IV, Articles 36 to 51."
  - id: 5e000000-0103-4000-8000-000000000002
    topic_id: 0199f5a0-0103-7000-8000-000000000103
    difficulty: 2
    stem: "The idea of the Directive Principles was borrowed from the constitution of:"
    options:
      - { id: a, text: "Ireland" }
      - { id: b, text: "Britain" }
      - { id: c, text: "the United States" }
      - { id: d, text: "France" }
    correct: a
    explanation: "The Directive Principles were modelled on the Directive Principles of Social Policy in the Constitution of Ireland."
  - id: 5e000000-0103-4000-8000-000000000003
    topic_id: 0199f5a0-0103-7000-8000-000000000103
    difficulty: 2
    stem: "Which Article says the Directive Principles are not enforceable by any court?"
    options:
      - { id: a, text: "Article 36" }
      - { id: b, text: "Article 37" }
      - { id: c, text: "Article 40" }
      - { id: d, text: "Article 51" }
    correct: b
    explanation: "Article 37 says the Directive Principles cannot be enforced by courts but are fundamental in the governance of the country."
  - id: 5e000000-0103-4000-8000-000000000004
    topic_id: 0199f5a0-0103-7000-8000-000000000103
    difficulty: 2
    stem: "Which Article directs the State to organise village panchayats?"
    options:
      - { id: a, text: "Article 44" }
      - { id: b, text: "Article 48" }
      - { id: c, text: "Article 50" }
      - { id: d, text: "Article 40" }
    correct: d
    explanation: "Article 40 asks the State to organise village panchayats as units of self-government. It is a Gandhian principle."
