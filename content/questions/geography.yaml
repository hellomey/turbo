    explanation: "The Himadri, or Greater Himalaya, is the highest and northernmost of the three ranges."
  - id: 5e000000-0301-4000-8000-000000000002
    topic_id: 0199f5a0-0301-7000-8000-000000000301
    difficulty: 1
