      # Local government (Panchayati Raj)

      Local government means people running the affairs of their own village or town through elected bodies. Article 40, a Directive Principle, asks the State to organise village panchayats.

      ## How it grew
      In 1957 the Balwant Rai Mehta Committee recommended a three-tier system of rural local government. Rajasthan was the first state to start it, at Nagaur on 2 October 1959. In 1977 the Ashok Mehta Committee suggested a two-tier system instead.

      ## The 73rd and 74th Amendments
      Local bodies got constitutional status in 1992.

      The 73rd Amendment added Part IX and the Eleventh Schedule for rural panchayats. The Eleventh Schedule lists 29 subjects that panchayats can handle. The amendment came into force on 24 April 1993, which is why 24 April is National Panchayati Raj Day.

      The 74th Amendment added Part IXA and the Twelfth Schedule for urban local bodies such as municipal corporations and municipalities. The Twelfth Schedule lists 18 subjects.

      ## Main features of the 73rd Amendment
      There are three tiers: the village panchayat, the intermediate (block) panchayat and the district panchayat. In Tamil Nadu the intermediate level is called the panchayat union.

      Every panchayat has a term of five years. If it is dissolved early, a new election must be held within six months.

      At least one third of the seats are reserved for women. Seats are also reserved for Scheduled Castes and Scheduled Tribes in proportion to their population.

      The State Election Commission conducts panchayat elections (Article 243K). A State Finance Commission is set up every five years to review panchayat finances (Article 243I).

      ## Gram Sabha
      The Gram Sabha is the body of all people registered on the electoral roll of a village. It meets to discuss the village's needs, approve plans and check the panchayat's work. It is the base of grassroots democracy.

      ## In Tamil Nadu
      The Tamil Nadu Panchayats Act, 1994 puts the 73rd Amendment into effect in the state. Village panchayat presidents are elected directly by the voters.
