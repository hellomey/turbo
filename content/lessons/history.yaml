    title: The Delhi Sultanate
    reading_minutes: 3
    body: |
      # The Delhi Sultanate

      The Delhi Sultanate is the name for five dynasties that ruled from Delhi between 1206 and 1526. In order they are the Slave (Mamluk), Khalji, Tughlaq, Sayyid and Lodi dynasties. A simple way to remember the order is S-K-T-S-L.

      ## The Slave dynasty
      Qutb-ud-din Aibak, a former slave of Muhammad Ghori, founded the Sultanate in 1206. He began building the Qutb Minar in Delhi, and his successor Iltutmish completed it.

      Iltutmish organised the state. He introduced the silver tanka and the copper jital coins and developed the iqta system, under which officers were given the revenue of a territory in return for service. His daughter Razia became the first and only woman ruler of the Delhi Sultanate.

      Balban raised the dignity of the Sultan. He followed a policy of "blood and iron" against rebels and introduced court customs such as sijda (prostration) and paibos (kissing the Sultan's feet).

      ## The Khaljis
      Jalal-ud-din Khalji founded the dynasty in 1290. His nephew Alauddin Khalji was its strongest ruler. Alauddin fixed the prices of grain and other goods in Delhi's markets, kept a large standing army, and branded horses (dagh) to stop cheating at musters. His general Malik Kafur led campaigns deep into South India. Alauddin also built the Alai Darwaza near the Qutb Minar. The poet Amir Khusrau lived in this period.

      ## The Tughlaqs
      Ghiyas-ud-din Tughlaq founded the dynasty. His son Muhammad bin Tughlaq is remembered for bold experiments that failed. He shifted the capital from Delhi to Daulatabad (Devagiri) and issued token currency in copper and brass. The Moroccan traveller Ibn Battuta visited his court.

      Firoz Shah Tughlaq built canals and new towns. In 1398 Timur invaded India and sacked Delhi, which weakened the Sultanate badly.

      ## The Sayyids and the Lodis
      The Sayyids ruled a much smaller kingdom. The Lodis, an Afghan dynasty, followed. Sikandar Lodi founded the city of Agra.

      ## The end
      In 1526 Babur defeated Ibrahim Lodi at the First Battle of Panipat. That battle ended the Delhi Sultanate and began Mughal rule.

