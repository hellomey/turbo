      # Indian National Movement (1885-1947)

      ## The Congress is born
      The Indian National Congress was founded in 1885 at Bombay. A. O. Hume, a retired British officer, helped organise it, and W. C. Bonnerjee was its first president. The early leaders, called the Moderates, used petitions and speeches.

      ## Partition of Bengal and Swadeshi
      In 1905 Lord Curzon partitioned Bengal. People protested with the Swadeshi movement, boycotting British goods and using Indian ones. In Tamil Nadu, V. O. Chidambaram started the Swadeshi Steam Navigation Company at Thoothukudi (Tuticorin) to compete with British shipping, and the poet Subramania Bharathi wrote patriotic songs. The Muslim League was founded in 1906 at Dhaka. The Congress split into Moderates and Extremists at Surat in 1907.

      ## Home Rule and Lucknow
      In 1916 the Congress and the Muslim League signed the Lucknow Pact. The same year Bal Gangadhar Tilak and Annie Besant started Home Rule Leagues.

      ## Gandhi's arrival
      Gandhi led his first satyagraha in India at Champaran in Bihar in 1917, for indigo farmers. In 1919 the Rowlatt Act allowed detention without trial. On 13 April 1919, troops under General Dyer fired on a peaceful crowd at Jallianwala Bagh in Amritsar.

      ## Non-Cooperation
      Gandhi launched the Non-Cooperation Movement in 1920. He called it off in 1922 after a crowd set fire to a police station at Chauri Chaura.

      ## Towards complete independence
      The all-British Simon Commission came in 1928 and was met with the slogan "Simon, go back". At the Lahore session of 1929, presided over by Jawaharlal Nehru, the Congress adopted Purna Swaraj (complete independence) as its goal. 26 January 1930 was celebrated as Independence Day, and that date was later chosen for the Constitution to come into force.

      ## Salt Satyagraha
      On 12 March 1930 Gandhi began the Dandi March to break the salt law, starting the Civil Disobedience Movement. In Tamil Nadu, C. Rajagopalachari led a salt march from Tiruchirappalli to Vedaranyam. The Gandhi-Irwin Pact followed in 1931, and Gandhi attended the Second Round Table Conference in London. In 1932 Gandhi and B. R. Ambedkar signed the Poona Pact on representation for the depressed classes.

      ## Quit India and after
      On 8 August 1942 the Congress launched the Quit India Movement, and Gandhi gave the call "Do or Die". Subhas Chandra Bose led the Indian National Army against the British. The Cabinet Mission came in 1946, and the Mountbatten Plan of June 1947 led to the partition of the country. India became independent on 15 August 1947.
