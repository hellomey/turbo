  - topic_id: 0199f5a0-0202-7000-8000-000000000202
    title: The Mauryan Empire
    reading_minutes: 3
    body: |
      # The Mauryan Empire

      The Mauryas built the first empire that covered most of the Indian subcontinent. Their capital was Pataliputra, near present-day Patna in Bihar.

      ## Chandragupta Maurya
      Chandragupta Maurya founded the empire around 321 BCE after overthrowing the Nanda dynasty of Magadha. His adviser was Chanakya, also known as Kautilya. The Arthashastra, a book on statecraft, economy and administration, is credited to Kautilya.

      Chandragupta defeated Seleucus Nicator, a general of Alexander. Seleucus later sent an ambassador, Megasthenes, to the Mauryan court. Megasthenes wrote Indica, which survives only in quotations by later Greek writers. It describes Pataliputra and Mauryan society.

      Jain tradition says Chandragupta became a Jain in his last years and went to Shravanabelagola in present-day Karnataka. The play Mudrarakshasa by Vishakhadatta tells the story of his rise.

      ## Bindusara
      Chandragupta's son Bindusara ruled next and kept the empire together.

      ## Ashoka
      Ashoka, son of Bindusara, is the best-known Mauryan ruler. He fought the Kalinga war (in present-day Odisha) around 261 BCE. The loss of life in that war changed him. He gave up conquest by war and turned to Dhamma, a code of moral conduct based on tolerance, respect for elders, kindness to animals and care for all people.

      Ashoka spread his message through edicts carved on rocks and pillars. Most are in the Prakrit language and the Brahmi script. James Prinsep deciphered Brahmi in 1837. In the edicts Ashoka calls himself Devanampiya Piyadasi, "beloved of the gods". One of his rock edicts names the Cholas, Pandyas, Cheras and Satiyaputras as neighbours beyond his empire, which tells us the far south was outside Mauryan rule.

      Ashoka appointed officers called Dhamma Mahamattas to spread Dhamma. He sent his son Mahendra and daughter Sanghamitra to Sri Lanka to spread Buddhism. The third Buddhist Council was held at Pataliputra during his reign.

      The Lion Capital of the Ashokan pillar at Sarnath is India's national emblem, and the wheel on it appears on the national flag.

      ## Decline
      The empire weakened after Ashoka. Pushyamitra Shunga killed the last Mauryan king, Brihadratha, and founded the Shunga dynasty.

