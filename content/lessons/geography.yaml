      # Climate and the monsoon

      India has a tropical monsoon climate. The word monsoon comes from the Arabic word mausim, meaning season. The monsoon is a seasonal reversal of winds: they blow from sea to land in summer and from land to sea in winter.

      ## The four seasons
      The Indian Meteorological Department describes four seasons.

      The cold season runs roughly from December to February. Western disturbances, weather systems from the Mediterranean region, bring winter rain to north-west India, which helps the wheat crop.

      The hot season runs from March to May. A hot, dry wind called the loo blows over the northern plains. Pre-monsoon showers come in the south: in Kerala and Karnataka they help mangoes ripen and are called mango showers. In West Bengal, violent evening storms called Kalbaisakhi (nor'westers) bring rain.

      The south-west monsoon season runs from June to September. The monsoon usually reaches the Kerala coast around the beginning of June. It splits into an Arabian Sea branch and a Bay of Bengal branch. The Western Ghats force the Arabian Sea winds to rise, so their western slopes get heavy rain while the land to their east lies in a rain shadow. Mawsynram and Cherrapunji in Meghalaya receive some of the highest rainfall in the world.

      The retreating monsoon season runs from October to December. The winds now blow from the north-east. They pick up moisture over the Bay of Bengal and bring rain to the Tamil Nadu coast. This is why Tamil Nadu gets most of its rain from the north-east monsoon, while most of India gets its rain from the south-west monsoon. Cyclones from the Bay of Bengal are common in this season.

      ## What affects the monsoon
      El Nino, the warming of the eastern Pacific Ocean, is often linked to a weak monsoon in India.

      ## Monsoon and crops
      Kharif crops such as rice are sown with the arrival of the south-west monsoon. Rabi crops such as wheat are sown in winter and harvested in spring.

