      # Geography of Tamil Nadu

      Tamil Nadu is at the south-eastern tip of the Indian peninsula. Kerala lies to its west, Karnataka and Andhra Pradesh to its north, the Bay of Bengal to its east and the Indian Ocean to its south. Chennai is the capital. Kanyakumari, at the southern tip, is where the Arabian Sea, the Indian Ocean and the Bay of Bengal meet.

      ## Hills
      The Western Ghats run along the western border. The Nilgiris rise where the Western and Eastern Ghats meet, and Doddabetta there is the highest peak in Tamil Nadu. Further south are the Anamalai hills and the Palani hills, where the hill station Kodaikanal stands.

      The Eastern Ghats in Tamil Nadu are a broken chain of hills: the Javadhu hills, the Shevaroy hills (with Yercaud) near Salem, and the Kolli hills in Namakkal district.

      The Palghat Gap, a break in the Western Ghats, links Tamil Nadu with Kerala.

      ## Rivers and the delta
      The Kaveri is Tamil Nadu's main river. The Mettur dam stands on it in Salem district. Its delta around Thanjavur is so productive that Thanjavur is called the rice bowl of Tamil Nadu. Other rivers include the Vaigai, which flows past Madurai, and the Thamirabarani in the south.

      ## The coast
      Tamil Nadu has a long eastern coastline called the Coromandel coast. Pulicat Lake, a brackish-water lagoon, lies on the border with Andhra Pradesh. Point Calimere (Kodiakkarai) is a bird sanctuary. The Gulf of Mannar, between Tamil Nadu and Sri Lanka, is a marine biosphere reserve. Rameswaram stands on Pamban Island, joined to the mainland by the Pamban bridge.

      ## Climate
      Tamil Nadu lies in the rain shadow of the Western Ghats during the south-west monsoon. It gets most of its rain from the north-east monsoon between October and December.

      ## Protected areas
      The Nilgiri Biosphere Reserve was the first biosphere reserve in India. Mudumalai, in the Nilgiris, is a tiger reserve. Vedanthangal is one of the oldest bird sanctuaries in the country.

      ## Resources and industry
      Neyveli, in Cuddalore district, has large lignite deposits used to generate power. Muppandal in Kanyakumari district is a major wind energy site. Nuclear power plants stand at Kalpakkam and Koodankulam. Coimbatore is known as the Manchester of South India for its textile mills, Tiruppur for knitwear and Sivakasi for fireworks and printing.
