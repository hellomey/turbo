      # Rivers of India

      Indian rivers fall into two groups. Himalayan rivers are fed by snow and rain, so most flow all year. Peninsular rivers depend on rain, so many shrink in the dry season.

      ## The Ganga
      The Ganga rises from the Gangotri glacier as the Bhagirathi. At Devprayag the Bhagirathi meets the Alaknanda, and from there the river is called the Ganga. The Yamuna joins it at Prayagraj (Allahabad). The Kosi, a tributary in Bihar, floods so often that it is called the "Sorrow of Bihar". The Damodar was once called the "Sorrow of Bengal" for the same reason. The Ganga and the Brahmaputra together form the Sundarbans delta, home of the Royal Bengal tiger.

      ## The Brahmaputra
      The Brahmaputra rises in Tibet, where it is called the Tsangpo. It enters India through Arunachal Pradesh and flows through Assam. Majuli in the Brahmaputra is one of the largest river islands in the world.

      ## The Indus
      The Indus also rises in Tibet. Its five main tributaries are the Jhelum, Chenab, Ravi, Beas and Sutlej. India and Pakistan share these waters under the Indus Waters Treaty of 1960. The Bhakra Nangal dam stands on the Sutlej.

      ## East-flowing peninsular rivers
      The Godavari is the longest peninsular river and is called the Dakshin Ganga. The Mahanadi has the Hirakud dam in Odisha. The Krishna flows through Maharashtra, Karnataka, Telangana and Andhra Pradesh.

      The Kaveri rises at Talakaveri in the Brahmagiri hills of Kodagu, Karnataka. It enters Tamil Nadu, falls at Hogenakkal, fills the Mettur dam and forms a fertile delta in the Thanjavur region before reaching the Bay of Bengal.

      ## West-flowing rivers
      The Narmada and the Tapi flow west through rift valleys into the Arabian Sea, and they form estuaries, not deltas. The Sardar Sarovar dam stands on the Narmada. Jog Falls in Karnataka is on the Sharavathi.

      ## A river that does not reach the sea
      The Luni flows through the Thar Desert and ends in the marshes of the Rann of Kutch.

