      # Physical features of India

      India's land can be divided into five broad parts: the Himalayas in the north, the Northern Plains, the Peninsular Plateau, the coastal plains and the islands. The Thar Desert lies in the north-west.

      ## The Himalayas
      The Himalayas are young fold mountains with three parallel ranges. The northernmost and highest is the Himadri (Greater Himalaya). South of it is the Himachal (Lesser Himalaya), where hill stations such as Shimla stand. The lowest and outermost range is the Shiwalik.

      ## The Northern Plains
      The Indus, the Ganga, the Brahmaputra and their tributaries built these plains by depositing alluvium. Near the foothills is the Bhabar, a belt of pebbles where streams vanish underground. South of it is the wet, marshy Terai. The older alluvium is called Bhangar and the newer, more fertile alluvium is called Khadar.

      ## The Peninsular Plateau
      This is the oldest landmass of India. The Aravalli range in Rajasthan is among the oldest fold mountains in the world, and Guru Shikhar on Mount Abu is its highest point. The Deccan Plateau is bordered by the Western Ghats and the Eastern Ghats.

      The Western Ghats, also called the Sahyadri, run close to the west coast and are almost continuous. Anaimudi in Kerala is the highest peak of South India. The Eastern Ghats are lower and broken into pieces by rivers flowing to the Bay of Bengal. The two ranges meet in the Nilgiris, where Doddabetta is the highest peak.

      ## Coastal plains
      The west coast is narrow. Its parts are the Konkan coast in the north and the Malabar coast in Kerala. The east coast is wider and has large deltas. Its southern part, along Tamil Nadu, is the Coromandel coast.

      ## Islands
      The Andaman and Nicobar Islands lie in the Bay of Bengal. The Ten Degree Channel separates the Andaman group from the Nicobar group, and Barren Island there is India's only active volcano. Indira Point on Great Nicobar is the southernmost point of India. The Lakshadweep Islands in the Arabian Sea are made of coral.

      ## Neighbours across water
      The Palk Strait separates India from Sri Lanka.

