    title: National income
    reading_minutes: 3
    body: |
      # National income

      National income tells us how much a country produces and earns in a year. In India the year is the financial year, from April to March.

      ## Key terms
      Gross Domestic Product (GDP) is the market value of all final goods and services produced within a country's borders in a year.

      Gross National Product (GNP) adds net factor income from abroad to GDP. That is what Indians earn abroad minus what foreigners earn in India.

      Net National Product (NNP) is GNP minus depreciation, the wear and tear of machines and buildings.

      NNP at factor cost is called national income. To get factor cost from market price, take away indirect taxes and add subsidies.

      Per capita income is national income divided by the population. It gives the average income per person but hides inequality.

      ## Why only final goods?
      If we counted both the steel and the car made from that steel, the steel would be counted twice. To avoid double counting, only final goods and services are added, or only the value added at each stage. Transfer payments such as old-age pensions are also left out, because nothing is produced in return.

      ## Nominal and real
      Nominal GDP uses current prices. Real GDP uses the prices of a base year, so it removes the effect of inflation. The GDP deflator compares the two. India's present base year for national accounts is 2011-12.

      ## Three methods
      There are three ways to measure national income. The product (value added) method adds up output. The income method adds rent, wages, interest and profit. The expenditure method adds spending on consumption, investment, government purchases and net exports.

      ## Who measures it in India
      Dadabhai Naoroji made the first estimate of India's per capita income, in his book Poverty and Un-British Rule in India. After independence, the National Income Committee was set up in 1949 under P. C. Mahalanobis. Today the National Statistics Office under the Ministry of Statistics and Programme Implementation publishes the estimates.

      ## Sectors
      The economy has three sectors. The primary sector covers agriculture, forestry, fishing and mining. The secondary sector covers manufacturing and construction. The tertiary sector covers services such as banking, transport and trade. In India today the tertiary sector contributes the largest share of GDP.

