  - topic_id: 0199f5a0-0401-7000-8000-000000000401
    title: Five-Year Plans and NITI Aayog
    reading_minutes: 3
    body: |
      # Five-Year Plans and NITI Aayog

      After independence, India chose planned development. The government set goals for five years at a time and decided how to spend money to reach them.

      ## Ideas before independence
      M. Visvesvaraya wrote "Planned Economy for India" in 1934. In 1944 a group of industrialists put forward the Bombay Plan. Other proposals of that time included the Gandhian Plan and M. N. Roy's People's Plan.

      ## The Planning Commission
      The Planning Commission was set up in March 1950 by a resolution of the Union government. It was not created by the Constitution. The Prime Minister was its chairman. The National Development Council, which included the Chief Ministers, gave final approval to each plan.

      ## Some plans to remember
      The First Plan (1951-56) focused on agriculture and irrigation, because the country faced food shortages. It was based on the Harrod-Domar model.

      The Second Plan (1956-61) focused on heavy industry. It was based on the model of P. C. Mahalanobis.

      After the Third Plan, war and drought led to a gap from 1966 to 1969 with three annual plans, often called the plan holiday.

      The Fifth Plan is remembered for the goal of removing poverty, expressed in the slogan Garibi Hatao. The Janata government replaced it early with a Rolling Plan (1978-80).

      The Eighth Plan (1992-97) came after the economic reforms of 1991, which opened the economy through liberalisation, privatisation and globalisation.

      The Eleventh Plan aimed at faster and more inclusive growth. The Twelfth Plan (2012-17) aimed at faster, more sustainable and more inclusive growth. It was the last Five-Year Plan.

      ## NITI Aayog
      On 1 January 2015 the government replaced the Planning Commission with the NITI Aayog. NITI stands for National Institution for Transforming India.

      The Prime Minister is its chairperson, and a Vice-Chairperson is appointed by the Prime Minister. Its Governing Council includes the Chief Ministers of all states and the heads of Union Territories with legislatures.

      NITI Aayog works as a think tank. It does not allot funds to states the way the Planning Commission did. It follows the idea of cooperative federalism, where the Union and the states work together, and it tracks progress on goals such as the Sustainable Development Goals.

