      # Goods and Services Tax (GST)

      GST is an indirect tax on the supply of goods and services. It came into force across India on 1 July 2017 and replaced many separate taxes with one system. That is why it was described as "One Nation, One Tax". 1 July is observed as GST Day.

      ## The constitutional basis
      The Constitution (101st Amendment) Act, 2016 made GST possible. It gave both Parliament and the State Legislatures power to tax the same supply of goods and services.

      ## What GST replaced
      GST took the place of Union taxes such as central excise duty and service tax, and state taxes such as value added tax (VAT), entry tax and entertainment tax.

      ## Three parts
      India uses a dual GST, so both the Union and the states collect it.
      - CGST (Central GST) is collected by the Union on supplies within a state.
      - SGST (State GST) is collected by the state on the same supplies.
      - IGST (Integrated GST) is collected by the Union on supplies from one state to another and on imports. It is later shared with the consuming state.

      ## A destination-based tax
      GST is collected where goods or services are consumed, not where they are produced. Consuming states therefore receive the revenue.

      ## Input tax credit
      A business can deduct the GST it paid on its inputs from the GST it collects on its sales. Tax is paid only on the value added at each stage, so the old problem of tax on tax (the cascading effect) is removed.

      ## The GST Council
      Article 279A created the GST Council. The Union Finance Minister is its chairperson, and the Finance Ministers of the states are members. The Council recommends tax rates, exemptions and rules.

      ## Items kept outside
      Alcohol for human consumption is outside GST. Petroleum products such as petrol, diesel and crude oil are not yet taxed under GST; the Council has to decide when to bring them in.

      ## Small businesses
      Small taxpayers can choose the composition scheme. They pay tax at a low fixed rate on turnover and file simpler returns, but they cannot claim input tax credit.

      ## The technology
      The Goods and Services Tax Network (GSTN) runs the online system for registration, returns and payments.
