# TNPSC Group 4 (incl. VAO) syllabus map.
# SEED DATA for local/staging (BOLT-0003). The real map is authored and human-checked in the content track (blueprint §27 track B).
# Every topic id is a STABLE UUID (hand-written, UUIDv7-shaped). Never reuse or renumber: the app's lamps point at them.
# Topics shared with other exams keep ONE id (one lamp, many exam colours): list the other exam codes in `shared_with`.
# Textbook refs: TN State Board books. Class levels and chapter numbers are PLAUSIBLE PLACEHOLDERS: TO BE VERIFIED
# against the current editions by the content track before anything is published in production. Pages are left empty until then.
exam:
  code: tnpsc-group-4
  name: TNPSC Group 4 (including VAO)
  official_syllabus_url: https://www.tnpsc.gov.in/   # exact notification PDF link added by Ops, human-checked
  textbook_site: https://textbooksonline.tn.nic.in/  # official free TN State Board textbooks (to be verified per book)
  pattern:
    mode: omr
    questions: 200
    negative_marking: false

