<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <clipPath id="sq1_clip">
      <rect width="64" height="64" rx="32" />
    </clipPath>
    <linearGradient id="sq1_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <linearGradient id="sq1_lamp" x1="20" y1="44" x2="44" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <g clip-path="url(#sq1_clip)">
    <!-- Avatar Background -->
    <rect width="64" height="64" fill="url(#sq1_bg)" />

    <!-- Radiant Glow -->
    <circle cx="32" cy="28" r="22" fill="#FFFFFF" opacity="0.45" />

    <!-- Squad Member Coat (Violet Study Blazer) -->
    <path d="M12 64 C12 48 20 44 32 44 C44 44 52 48 52 64 Z" fill="#7C3AED" />
    <path d="M26 44 L32 54 L38 44" fill="#EDE9FE" />

    <!-- Blue Lit Lamp Rank Badge on Shoulder -->
    <circle cx="43" cy="50" r="4.5" fill="url(#sq1_lamp)" />
    <path d="M43 47 C42 48.5 42 49.5 43 51 C44 49.5 44 48.5 43 47 Z" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="28" y="34" width="8" height="12" rx="3" fill="#FBBF24" opacity="0.8" />

    <!-- Head & Face -->
    <ellipse cx="32" cy="27" rx="10.5" ry="12" fill="#FED7AA" />

    <!-- Cheeks & Smile -->
    <ellipse cx="25" cy="30" rx="1.8" ry="1.2" fill="#F43F5E" opacity="0.5" />
    <ellipse cx="39" cy="30" rx="1.8" ry="1.2" fill="#F43F5E" opacity="0.5" />
    <path d="M29 31 C30.5 33.5 33.5 33.5 35 31" stroke="#831843" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Bright Eyes -->
    <ellipse cx="27" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <ellipse cx="37" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <circle cx="26.4" cy="25.2" r="0.6" fill="#FFFFFF" />
    <circle cx="36.4" cy="25.2" r="0.6" fill="#FFFFFF" />

    <!-- Hair (High Ponytail / Bun with Gold Hairpin) -->
    <circle cx="32" cy="11" r="6" fill="#18181B" />
    <path d="M20 24 C19 16 25 13 32 13 C39 13 45 16 44 24 C44 20 40 17 32 17 C24 17 20 20 20 24 Z" fill="#18181B" />
    <!-- Golden Hairpin -->
    <rect x="27" y="10" width="10" height="2" rx="1" fill="#F59E0B" />
  </g>
</svg>