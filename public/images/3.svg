<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <clipPath id="you_av_clip">
      <rect width="64" height="64" rx="32" />
    </clipPath>
    <linearGradient id="you_av_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEADE" />
      <stop offset="100%" stop-color="#FFC5A3" />
    </linearGradient>
    <linearGradient id="you_gold" x1="20" y1="12" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="50%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <g clip-path="url(#you_av_clip)">
    <!-- Avatar Background -->
    <rect width="64" height="64" fill="url(#you_av_bg)" />

    <!-- Ambient Aura -->
    <circle cx="32" cy="28" r="22" fill="#FFFFFF" opacity="0.5" />

    <!-- Aspirant Hoodie / Sweater (Modern Teal Study Hoodie) -->
    <path d="M12 64 C12 48 20 44 32 44 C44 44 52 48 52 64 Z" fill="#0284C7" />
    <!-- Hoodie V-neck and strings -->
    <path d="M26 44 C28 50 36 50 38 44 Z" fill="#0369A1" />
    <circle cx="32" cy="48" r="2" fill="#BAE6FD" />

    <!-- Golden HeyMey Diya Flame Pin on Chest -->
    <path d="M38 52 C37 50 37 48 39 46 C41 48 41 50 40 52 C39.5 53 38.5 53 38 52 Z" fill="url(#you_gold)" />
    <circle cx="39" cy="49" r="0.8" fill="#FFFBEB" />

    <!-- Neck -->
    <rect x="28" y="34" width="8" height="12" rx="3" fill="#FBBF24" opacity="0.8" />
    <path d="M28 36 C30 40 34 40 36 36 Z" fill="#D97706" opacity="0.3" />

    <!-- Head & Face -->
    <ellipse cx="32" cy="27" rx="11" ry="12" fill="#FED7AA" />

    <!-- Friendly Cheeks & Smile -->
    <ellipse cx="24" cy="30" rx="2" ry="1.2" fill="#FB7185" opacity="0.6" />
    <ellipse cx="40" cy="30" rx="2" ry="1.2" fill="#FB7185" opacity="0.6" />
    <path d="M28 31 C29.5 34 34.5 34 36 31" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Enthusiastic Aspirant) -->
    <ellipse cx="26" cy="26" rx="1.6" ry="2.2" fill="#1E293B" />
    <ellipse cx="38" cy="26" rx="1.6" ry="2.2" fill="#1E293B" />
    <circle cx="25.3" cy="25" r="0.7" fill="#FFFFFF" />
    <circle cx="37.3" cy="25" r="0.7" fill="#FFFFFF" />

    <!-- Smart Sleek Study Glasses -->
    <rect x="22" y="22" width="9" height="7.5" rx="3" fill="none" stroke="#0F172A" stroke-width="1.3" />
    <rect x="33" y="22" width="9" height="7.5" rx="3" fill="none" stroke="#0F172A" stroke-width="1.3" />
    <path d="M31 25.5 L33 25.5" stroke="#0F172A" stroke-width="1.3" />

    <!-- Hair (Textured Casual Crop) -->
    <path d="M20 22 C20 14 26 11 32 11 C38 11 44 14 44 22 C43 18 39 16 32 16 C25 16 21 18 20 22 Z" fill="#451A03" />
    <path d="M22 17 C25 13 31 12 37 13 C35 15 31 15 28 16 Z" fill="#78350F" />

    <!-- Floating Mini Sparkles -->
    <circle cx="16" cy="20" r="1.2" fill="#F97316" />
    <path d="M47 16 L48 18 L50 19 L48 20 L47 22 L46 20 L44 19 L46 18 Z" fill="#F59E0B" />
  </g>
</svg>