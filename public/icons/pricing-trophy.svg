<svg xmlns="http://www.w3.org/2000/svg" width="200" height="340" viewBox="0 0 200 340" fill="none">
  <defs>
    <!-- Background Cloud Gradient -->
    <linearGradient id="pt_cloud" x1="100" y1="180" x2="100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <!-- Rich Gold Trophy Gradient -->
    <linearGradient id="pt_gold" x1="60" y1="80" x2="140" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="28%" stop-color="#FFCA28" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="pt_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <linearGradient id="pt_laurel" x1="40" y1="70" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="pt_shadow" x="30" y="70" width="140" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4C1D95" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Victory Aura -->
  <circle cx="100" cy="140" r="70" fill="#E9D5FF" opacity="0.4" filter="blur(20px)" />
  <circle cx="100" cy="120" r="45" fill="#FFFFFF" opacity="0.5" filter="blur(10px)" />

  <!-- Laurel Victory Wreath (Left & Right) -->
  <g stroke="url(#pt_laurel)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M58 170 C42 150 40 115 54 95" />
    <ellipse cx="48" cy="106" rx="6" ry="2.8" transform="rotate(-35 48 106)" fill="#C084FC" stroke="none" />
    <ellipse cx="43" cy="125" rx="6" ry="2.8" transform="rotate(-15 43 125)" fill="#C084FC" stroke="none" />
    <ellipse cx="47" cy="145" rx="6" ry="2.8" transform="rotate(12 47 145)" fill="#C084FC" stroke="none" />
    <ellipse cx="55" cy="162" rx="6" ry="2.8" transform="rotate(38 55 162)" fill="#C084FC" stroke="none" />

    <path d="M142 170 C158 150 160 115 146 95" />
    <ellipse cx="152" cy="106" rx="6" ry="2.8" transform="rotate(35 152 106)" fill="#C084FC" stroke="none" />
    <ellipse cx="157" cy="125" rx="6" ry="2.8" transform="rotate(15 157 125)" fill="#C084FC" stroke="none" />
    <ellipse cx="153" cy="145" rx="6" ry="2.8" transform="rotate(-12 153 145)" fill="#C084FC" stroke="none" />
    <ellipse cx="145" cy="162" rx="6" ry="2.8" transform="rotate(-38 145 162)" fill="#C084FC" stroke="none" />
  </g>

  <!-- Floating Cloud Cushion -->
  <path d="M50 250 C40 250 35 240 40 230 C35 220 42 208 55 210 C62 195 85 195 95 205 C105 195 130 195 140 208 C155 208 165 220 160 235 C165 245 155 255 145 252 C135 260 65 260 50 250 Z" fill="url(#pt_cloud)" opacity="0.95" />

  <!-- 3D Chunky Grand Trophy (Career Ladder Rank) -->
  <g filter="url(#pt_shadow)">
    <!-- Left Trophy Handle -->
    <path d="M74 110 C50 110 48 145 74 150" stroke="url(#pt_gold)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M74 110 C52 110 50 143 72 148" stroke="url(#pt_shine)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Right Trophy Handle -->
    <path d="M126 110 C150 110 152 145 126 150" stroke="url(#pt_gold)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M126 110 C148 110 150 143 128 148" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Main Trophy Cup -->
    <path d="M68 96 C68 96 66 135 84 158 C90 166 110 166 116 158 C134 135 132 96 132 96 Z" fill="url(#pt_gold)" />
    
    <!-- Cup Left Gloss Specular Highlight -->
    <path d="M72 102 C72 102 70 132 84 150 C78 132 78 104 78 102 Z" fill="#FFFFFF" opacity="0.55" />

    <!-- Top Rim of Cup -->
    <ellipse cx="100" cy="96" rx="32" ry="8" fill="url(#pt_shine)" />
    <ellipse cx="100" cy="96" rx="28" ry="5.5" fill="#B45309" />
    <ellipse cx="100" cy="97" rx="25" ry="4" fill="#D97706" />

    <!-- Crown Star on Trophy Front -->
    <g transform="translate(100, 126)">
      <circle cx="0" cy="0" r="10" fill="#FFFBEB" opacity="0.9" />
      <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#D97706" />
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Trophy Stem -->
    <path d="M94 162 H106 V178 H94 Z" fill="#9A3412" />
    <path d="M96 162 H104 V178 H96 Z" fill="url(#pt_gold)" />

    <!-- Trophy Base Pedestal -->
    <path d="M84 178 H116 L120 188 H80 Z" fill="url(#pt_gold)" />
    <rect x="74" y="188" width="52" height="24" rx="5" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- Golden Plaque on Base -->
    <rect x="82" y="193" width="36" height="12" rx="3" fill="url(#pt_shine)" />
    <text x="100" y="202" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="8" font-weight="700" fill="#78350F" letter-spacing="0.5px">RANK 1</text>
  </g>

  <!-- Floating HeyMey Badge Pill -->
  <g transform="translate(36, 275)">
    <rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <circle cx="16" cy="14" r="6" fill="#DDD6FE" />
    <path d="M16 11 L17 13 L19.5 13.5 L17.5 15 L18 17.5 L16 16 L14 17.5 L14.5 15 L12.5 13.5 L15 13 Z" fill="#7C3AED" />
    <text x="68" y="18" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600" fill="#0A0D12" letter-spacing="-0.2px">Collector Rank</text>
  </g>

  <!-- Sparkles -->
  <path d="M165 95 L167 101 L173 103 L167 105 L165 111 L163 105 L157 103 L163 101 Z" fill="#A855F7" />
  <circle cx="170" cy="115" r="2" fill="#FFFFFF" />
  <path d="M35 110 L36.5 114.5 L41 116 L36.5 117.5 L35 122 L33.5 117.5 L29 116 L33.5 114.5 Z" fill="#F59E0B" />
  <circle cx="30" cy="95" r="2" fill="#FFFFFF" />
</svg>
