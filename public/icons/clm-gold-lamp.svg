<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Rich Gold Body Gradient -->
    <linearGradient id="clm_gold_body" x1="30" y1="50" x2="90" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="28%" stop-color="#FFCA28" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#8C3B00" />
    </linearGradient>
    <linearGradient id="clm_gold_flame" x1="60" y1="16" x2="60" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF066" />
      <stop offset="60%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="clm_gold_shadow" x="20" y="15" width="80" height="95" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#854D0E" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Golden Radiance Aura -->
  <circle cx="60" cy="55" r="44" fill="#FEF08A" opacity="0.45" filter="blur(12px)" />

  <!-- Master Gold Triple Rings -->
  <ellipse cx="60" cy="58" rx="46" ry="22" stroke="#FFB800" stroke-width="2" stroke-dasharray="5 3" opacity="0.8" />
  <ellipse cx="60" cy="58" rx="38" ry="16" stroke="#F59E0B" stroke-width="1.2" opacity="0.6" />

  <g filter="url(#clm_gold_shadow)">
    <!-- Base Pedestal -->
    <ellipse cx="60" cy="98" rx="20" ry="6" fill="#78350F" />
    <path d="M46 94 C46 90 52 89 60 89 C68 89 74 90 74 94 L71 97 C71 99 49 99 49 97 Z" fill="url(#clm_gold_body)" />
    
    <!-- Central Stem -->
    <rect x="56.5" y="82" width="7" height="8" rx="2" fill="#B24900" />
    <rect x="58" y="82" width="4" height="8" rx="1" fill="#FFF9A6" />

    <!-- Main Diya Bowl -->
    <path d="M30 70 C30 84 44 90 60 90 C76 90 90 84 90 70 C90 64 76 65 60 65 C44 65 30 64 30 70 Z" fill="url(#clm_gold_body)" />
    
    <!-- Diya Rim -->
    <ellipse cx="60" cy="69" rx="28" ry="8.5" fill="#78350F" />
    <ellipse cx="60" cy="68.5" rx="25" ry="6.5" fill="#FFFBEB" opacity="0.9" />
    <ellipse cx="60" cy="69" rx="21" ry="5" fill="#F59E0B" />

    <!-- Polished Highlight -->
    <path d="M36 71 C42 75 78 75 84 71" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Pure Gold Flame -->
    <path d="M60 20 C49 36 45 48 50 62 C53 68 67 68 70 62 C75 48 71 36 60 20 Z" fill="url(#clm_gold_flame)" />
    <path d="M60 30 C54 42 52 50 55 58 C57 61 63 61 65 58 C68 50 66 42 60 30 Z" fill="#FFFBEB" />
    <circle cx="60" cy="51" r="3.2" fill="#FFFFFF" />

    <!-- Crown Star on Base -->
    <circle cx="60" cy="80" r="3.5" fill="#FFF9A6" />
    <circle cx="60" cy="80" r="1.8" fill="#D97706" />
  </g>

  <!-- Sparkles -->
  <path d="M96 35 L97.5 39 L101.5 40.5 L97.5 42 L96 46 L94.5 42 L90.5 40.5 L94.5 39 Z" fill="#F59E0B" />
  <circle cx="100" cy="54" r="1.8" fill="#FFFFFF" />
  <path d="M24 45 L25 47.5 L27.5 48.5 L25 49.5 L24 52 L23 49.5 L20.5 48.5 L23 47.5 Z" fill="#F59E0B" />
  <circle cx="22" cy="36" r="1.8" fill="#FFFFFF" />
</svg>
