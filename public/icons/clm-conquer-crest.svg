<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="clm_crest_gold" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="30%" stop-color="#FFCA28" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="clm_laurel_grad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="clm_crest_shadow" x="15" y="15" width="90" height="95" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4C1D95" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient Victory Aura -->
  <circle cx="60" cy="60" r="44" fill="#E9D5FF" opacity="0.45" filter="blur(12px)" />

  <g filter="url(#clm_crest_shadow)">
    <!-- Laurel Wreath Leaves (Left & Right) -->
    <g stroke="url(#clm_laurel_grad)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M36 82 C22 70 20 46 32 30" />
      <ellipse cx="28" cy="38" rx="4.5" ry="2" transform="rotate(-35 28 38)" fill="#C084FC" stroke="none" />
      <ellipse cx="23" cy="52" rx="4.5" ry="2" transform="rotate(-15 23 52)" fill="#C084FC" stroke="none" />
      <ellipse cx="27" cy="67" rx="4.5" ry="2" transform="rotate(15 27 67)" fill="#C084FC" stroke="none" />
      <ellipse cx="34" cy="78" rx="4.5" ry="2" transform="rotate(40 34 78)" fill="#C084FC" stroke="none" />

      <path d="M84 82 C98 70 100 46 88 30" />
      <ellipse cx="92" cy="38" rx="4.5" ry="2" transform="rotate(35 92 38)" fill="#C084FC" stroke="none" />
      <ellipse cx="97" cy="52" rx="4.5" ry="2" transform="rotate(15 97 52)" fill="#C084FC" stroke="none" />
      <ellipse cx="93" cy="67" rx="4.5" ry="2" transform="rotate(-15 93 67)" fill="#C084FC" stroke="none" />
      <ellipse cx="86" cy="78" rx="4.5" ry="2" transform="rotate(-40 86 78)" fill="#C084FC" stroke="none" />
    </g>

    <!-- Center Gold Shield Medallion -->
    <circle cx="60" cy="58" r="24" fill="url(#clm_crest_gold)" />
    <circle cx="60" cy="58" r="20" fill="#1E1B4B" />

    <!-- 5-Point Career Rank Star -->
    <path d="M60 42 L64 53 L75 54 L66.5 62 L69 73 L60 67 L51 73 L53.5 62 L45 54 L56 53 Z" fill="url(#clm_crest_gold)" />
    <circle cx="60" cy="59" r="3" fill="#FFFFFF" />

    <!-- Ribbon Tie at Bottom -->
    <path d="M52 84 C56 87 64 87 68 84" stroke="url(#clm_crest_gold)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M52 84 L46 96 L53 94 L57 86 Z" fill="url(#clm_crest_gold)" />
    <path d="M68 84 L74 96 L67 94 L63 86 Z" fill="url(#clm_crest_gold)" />
  </g>

  <!-- Sparkles -->
  <path d="M60 18 L61.5 22 L65.5 23.5 L61.5 25 L60 29 L58.5 25 L54.5 23.5 L58.5 22 Z" fill="#F59E0B" />
  <circle cx="95" cy="28" r="2" fill="#FFFFFF" />
  <circle cx="25" cy="28" r="2" fill="#F59E0B" />
</svg>
