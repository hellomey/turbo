<svg xmlns="http://www.w3.org/2000/svg" width="200" height="340" viewBox="0 0 200 340" fill="none">
  <defs>
    <!-- Background Cloud Gradient -->
    <linearGradient id="pl_cloud" x1="100" y1="180" x2="100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF5FF" />
      <stop offset="100%" stop-color="#CCE7FF" />
    </linearGradient>
    <!-- Brass Diya Gradient -->
    <linearGradient id="pl_brass" x1="60" y1="160" x2="140" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="30%" stop-color="#FFCA28" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <!-- Flame Gradient -->
    <linearGradient id="pl_flame" x1="100" y1="60" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF066" />
      <stop offset="60%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <!-- Halo Ring Gradient -->
    <linearGradient id="pl_halo" x1="30" y1="70" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99CFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFD1B8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.9" />
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="pl_glow" x="20" y="20" width="160" height="240" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="pl_shadow" x="30" y="100" width="140" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#854D0E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="100" cy="140" r="70" fill="#FEF08A" opacity="0.35" filter="blur(20px)" />
  <circle cx="100" cy="120" r="45" fill="#FFFFFF" opacity="0.5" filter="blur(10px)" />

  <!-- Radiating Study Light Beams -->
  <g stroke="#FDE047" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 4">
    <line x1="100" y1="30" x2="100" y2="60" />
    <line x1="40" y1="80" x2="65" y2="98" />
    <line x1="160" y1="80" x2="135" y2="98" />
    <line x1="25" y1="135" x2="55" y2="135" />
    <line x1="175" y1="135" x2="145" y2="135" />
  </g>

  <!-- Concentric Orbit Rings of HeyMey (Lit -> Steady -> Gold) -->
  <ellipse cx="100" cy="140" rx="68" ry="32" stroke="url(#pl_halo)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.75" />
  <ellipse cx="100" cy="140" rx="54" ry="24" stroke="#FFB800" stroke-width="1.4" opacity="0.6" />

  <!-- Floating Cloud Pedestal Cushion -->
  <path d="M50 250 C40 250 35 240 40 230 C35 220 42 208 55 210 C62 195 85 195 95 205 C105 195 130 195 140 208 C155 208 165 220 160 235 C165 245 155 255 145 252 C135 260 65 260 50 250 Z" fill="url(#pl_cloud)" opacity="0.9" />

  <!-- 3D HeyMey Diya Sacred Lamp -->
  <g filter="url(#pl_shadow)">
    <!-- Base Tier of Diya -->
    <ellipse cx="100" cy="235" rx="36" ry="11" fill="#78350F" />
    <ellipse cx="100" cy="233" rx="33" ry="9" fill="url(#pl_brass)" />
    
    <!-- Central Pillar -->
    <path d="M92 210 L108 210 L105 228 L95 228 Z" fill="#9A3412" />
    <path d="M94 210 L106 210 L103 226 L97 226 Z" fill="url(#pl_brass)" />

    <!-- Main Diya Bowl -->
    <path d="M52 190 C52 214 74 224 100 224 C126 224 148 214 148 190 C148 180 126 182 100 182 C74 182 52 180 52 190 Z" fill="url(#pl_brass)" />
    
    <!-- Top Bowl Rim & Oil Reservoir -->
    <ellipse cx="100" cy="189" rx="44" ry="14" fill="#9A3412" />
    <ellipse cx="100" cy="188" rx="40" ry="11" fill="#FEF08A" opacity="0.85" />
    <ellipse cx="100" cy="189" rx="34" ry="8" fill="#B45309" />

    <!-- Polished Gold Rim Specular Highlight -->
    <path d="M60 190 C70 197 130 197 140 190" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Front Medallion Emblem -->
    <circle cx="100" cy="208" r="6" fill="#FFF9A6" />
    <circle cx="100" cy="208" r="4" fill="#D97706" />
    <circle cx="100" cy="208" r="1.8" fill="#FFFFFF" />

    <!-- Sacred Golden Flame -->
    <!-- Outer Flame Halo -->
    <path d="M100 80 C84 112 78 136 86 156 C90 166 110 166 114 156 C122 136 116 112 100 80 Z" fill="url(#pl_flame)" filter="url(#pl_glow)" />

    <!-- Core Inner Steady Flame -->
    <path d="M100 102 C88 124 86 142 92 154 C94 158 106 158 108 154 C114 142 112 124 100 102 Z" fill="#FFFBEB" />
    
    <!-- White Hot Core Center -->
    <circle cx="100" cy="142" r="5" fill="#FFFFFF" />
  </g>

  <!-- Floating HeyMey Badge Pill -->
  <g transform="translate(42, 275)">
    <rect width="116" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <circle cx="16" cy="14" r="6" fill="#FEF08A" />
    <!-- Mini Diya Flame in pill -->
    <path d="M16 10 C15 12 14.5 13.5 15 15 C15.5 16 16.5 16 17 15 C17.5 13.5 17 12 16 10 Z" fill="#EA580C" />
    <text x="58" y="18" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600" fill="#0A0D12" letter-spacing="-0.2px">Lit Topics</text>
  </g>

  <!-- Twinkling Stars -->
  <path d="M165 95 L167 101 L173 103 L167 105 L165 111 L163 105 L157 103 L163 101 Z" fill="#F59E0B" />
  <circle cx="172" cy="120" r="2" fill="#FFFFFF" />
  <path d="M35 110 L36.5 114.5 L41 116 L36.5 117.5 L35 122 L33.5 117.5 L29 116 L33.5 114.5 Z" fill="#FFFFFF" />
  <circle cx="30" cy="95" r="2" fill="#F59E0B" />
</svg>
