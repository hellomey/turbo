<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="rank_clip">
      <circle cx="40" cy="40" r="40" />
    </clipPath>
    <!-- Background Gradient -->
    <linearGradient id="rank_bg" x1="12" y1="10" x2="68" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2E3FF" />
      <stop offset="100%" stop-color="#BA7BFD" />
    </linearGradient>
    <!-- Rich Gold Trophy Body Gradient -->
    <linearGradient id="trophy_gold" x1="26" y1="18" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="28%" stop-color="#FFCA28" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#BD5600" />
    </linearGradient>
    <!-- Gold Highlight Gradient -->
    <linearGradient id="gold_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <!-- Pedestal Base Gradient -->
    <linearGradient id="base_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D2845" />
      <stop offset="100%" stop-color="#171328" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="rank_shadow" x="14" y="14" width="52" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4.5" stdDeviation="3.5" flood-color="#4C1D95" flood-opacity="0.38" />
    </filter>
  </defs>

  <g clip-path="url(#rank_clip)">
    <!-- Base Gamified Circle -->
    <circle cx="40" cy="40" r="40" fill="url(#rank_bg)" />

    <!-- Radiant Victory Aura -->
    <circle cx="40" cy="38" r="28" fill="#FFFFFF" opacity="0.4" />
    <circle cx="40" cy="38" r="20" fill="#E9D5FF" opacity="0.6" filter="blur(6px)" />

    <!-- Royal Laurel Garland (Symmetrical Victory Leaves) -->
    <g stroke="#9333EA" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <!-- Left Laurel Branch -->
      <path d="M26 50 C18 44 16 31 23 23" />
      <ellipse cx="20" cy="27" rx="3.5" ry="1.6" transform="rotate(-35 20 27)" fill="#C084FC" stroke="none" />
      <ellipse cx="17.5" cy="35" rx="3.5" ry="1.6" transform="rotate(-15 17.5 35)" fill="#C084FC" stroke="none" />
      <ellipse cx="19.5" cy="42" rx="3.5" ry="1.6" transform="rotate(12 19.5 42)" fill="#C084FC" stroke="none" />
      <ellipse cx="23.5" cy="48" rx="3.5" ry="1.6" transform="rotate(38 23.5 48)" fill="#C084FC" stroke="none" />

      <!-- Right Laurel Branch -->
      <path d="M54 50 C62 44 64 31 57 23" />
      <ellipse cx="60" cy="27" rx="3.5" ry="1.6" transform="rotate(35 60 27)" fill="#C084FC" stroke="none" />
      <ellipse cx="62.5" cy="35" rx="3.5" ry="1.6" transform="rotate(15 62.5 35)" fill="#C084FC" stroke="none" />
      <ellipse cx="60.5" cy="42" rx="3.5" ry="1.6" transform="rotate(-12 60.5 42)" fill="#C084FC" stroke="none" />
      <ellipse cx="56.5" cy="48" rx="3.5" ry="1.6" transform="rotate(-38 56.5 48)" fill="#C084FC" stroke="none" />
    </g>

    <!-- 3D Chunky Grandmaster Gold Trophy -->
    <g filter="url(#rank_shadow)">
      <!-- Left Heavy Curved Handle -->
      <path d="M30 26 C20 26 19 40 30 42" stroke="url(#trophy_gold)" stroke-width="4.2" stroke-linecap="round" fill="none" />
      <path d="M30 26 C21 26 20 39 29 41" stroke="url(#gold_shine)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />

      <!-- Right Heavy Curved Handle -->
      <path d="M50 26 C60 26 61 40 50 42" stroke="url(#trophy_gold)" stroke-width="4.2" stroke-linecap="round" fill="none" />
      <path d="M50 26 C59 26 60 39 51 41" stroke="#BD5600" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />

      <!-- Trophy Main Cup Vessel -->
      <path d="M27 20 C27 20 26 35 33 44 C36 47 44 47 47 44 C54 35 53 20 53 20 Z" fill="url(#trophy_gold)" />
      
      <!-- Cup Left Gloss Specular Highlight -->
      <path d="M29 23 C29 23 28 34 33 41 C31 34 31 23 31 23 Z" fill="#FFFFFF" opacity="0.65" />

      <!-- Top Rim / Golden Lip -->
      <ellipse cx="40" cy="20" rx="13.5" ry="3.5" fill="url(#gold_shine)" />
      <ellipse cx="40" cy="20" rx="12" ry="2.2" fill="#B24900" />
      <ellipse cx="40" cy="20.8" rx="11" ry="1.8" fill="#F57C00" />

      <!-- Trophy Stem -->
      <path d="M37 45.5 H43 V51.5 H37 Z" fill="#B24900" />
      <path d="M38 45.5 H42 V51.5 H38 Z" fill="url(#trophy_gold)" />

      <!-- Pedestal / Trophy Base (Chunky Tiered) -->
      <path d="M33 51.5 H47 L48.5 54.5 H31.5 Z" fill="url(#trophy_gold)" />
      <rect x="29" y="54.5" width="22" height="7.5" rx="2.5" fill="url(#base_dark)" stroke="#F59E0B" stroke-width="1" />
      
      <!-- Golden Rank 1 Plaque on Pedestal -->
      <rect x="33.5" y="56.5" width="13" height="3.5" rx="1" fill="url(#gold_shine)" />
      <circle cx="35" cy="58.2" r="0.6" fill="#8C3B00" />
      <circle cx="45" cy="58.2" r="0.6" fill="#8C3B00" />

      <!-- Embossed Champion #1 Medallion on Cup Face -->
      <circle cx="40" cy="32" r="6.5" fill="#FFFFFF" fill-opacity="0.95" />
      <circle cx="40" cy="32" r="5.2" fill="url(#trophy_gold)" />
      <!-- Bold #1 Glyph -->
      <path d="M38.8 29.5 L40.8 28.5 V35.5 H39.2 V30 L38.4 30.5 V29.5 Z" fill="#FFFFFF" />
    </g>

    <!-- Floating Top Diamond Star Shines (Trophy Victory Sparkle) -->
    <g transform="translate(40, 11)">
      <!-- 4-Point Grand Diamond Flare -->
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.5" fill="#FEF08A" />
    </g>
    <!-- Secondary Twinkles -->
    <path d="M53 15 L54 17 L56 18 L54 19 L53 21 L52 19 L50 18 L52 17 Z" fill="#FFFFFF" />
    <circle cx="27" cy="16" r="1.5" fill="#FFFFFF" />
    <circle cx="58" cy="45" r="1.2" fill="#FFE58F" />
  </g>
</svg>
