<svg xmlns="http://www.w3.org/2000/svg" width="41" height="40" fill="none" viewBox="0 0 41 40">
  <defs>
    <linearGradient id="hm_bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A202C"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="hm_gold" x1="12" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE066"/>
      <stop offset="0.5" stop-color="#FFB800"/>
      <stop offset="1" stop-color="#FF8800"/>
    </linearGradient>
    <filter id="hm_glow" x="4" y="4" width="32" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="40" height="40" x=".5" fill="url(#hm_bg)" rx="10" stroke="#333D4B" stroke-width="1"/>
  <!-- Glowing Lamp & Flame -->
  <g filter="url(#hm_glow)">
    <!-- Outer Lamp Body -->
    <path d="M20.5 9c-4.4 0-7.8 3.3-7.8 7.6 0 3.2 2 5.8 4.9 6.9v1.6c0 1.5 1.3 2.7 2.9 2.7s2.9-1.2 2.9-2.7v-1.6c2.9-1.1 4.9-3.7 4.9-6.9 0-4.3-3.4-7.6-7.8-7.6z" fill="#FFFFFF" fill-opacity="0.15"/>
    <!-- Lamp core ring -->
    <circle cx="20.5" cy="16.5" r="5.5" stroke="url(#hm_gold)" stroke-width="2"/>
    <!-- Steady Gold Flame -->
    <path d="M20.5 12c-1.5 2-2 3.2-1.3 4.5.6 1.2 2 1.8 2.6 1.2.7-.6 1-2 .2-3.3-.5-.9-1-1.6-1.5-2.4z" fill="url(#hm_gold)"/>
    <circle cx="20.5" cy="15" r="1.5" fill="#FFFBE6"/>
    <!-- Lamp Stand -->
    <path d="M17.5 28.5h6v1.2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1.2z" fill="url(#hm_gold)"/>
  </g>
</svg>