    <ellipse cx="24.5" cy="26" rx="5.5" ry="7.5" transform="rotate(-60 24.5 26)" fill="#FFFFFF" />
    <ellipse cx="40.5" cy="34" rx="5.5" ry="7.5" transform="rotate(-60 40.5 34)" fill="#FFFFFF" />
    <ellipse cx="24.5" cy="34" rx="5.5" ry="7.5" transform="rotate(60 24.5 34)" fill="#FFFFFF" />
    <ellipse cx="40.5" cy="26" rx="5.5" ry="7.5" transform="rotate(60 40.5 26)" fill="#FFFFFF" />
