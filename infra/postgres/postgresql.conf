# Production starting values for a 24 GB container on NVMe (blueprint §21). Tune after load tests.
listen_addresses = '*'
max_connections = 200                 # apps connect through pgbouncer
shared_buffers = 8GB
effective_cache_size = 18GB
work_mem = 32MB
maintenance_work_mem = 1GB
wal_level = replica                   # ready for a streaming replica (§25)
max_wal_size = 8GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
shared_preload_libraries = 'pg_stat_statements'
timezone = 'UTC'                      # day logic uses Asia/Kolkata in the app, never the DB clock

# Continuous WAL archiving to off-site storage (pgBackRest -> Backblaze B2 / Cloudflare R2)
archive_mode = on
archive_command = 'pgbackrest --stanza=heymey archive-push %p'
