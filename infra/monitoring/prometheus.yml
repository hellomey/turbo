global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  # App metrics (/metrics) on their series ports, discovered through the edge network aliases.
  - job_name: heymey-apps
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["production-api"]
        type: A
        port: 4567
      - names: ["production-realtime"]
        type: A
        port: 4568
