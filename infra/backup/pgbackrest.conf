# pgBackRest (blueprint §20.3): daily full + continuous WAL to OFF-SITE S3-compatible storage, encrypted.
# Secrets (repo1-s3-key, repo1-s3-key-secret, repo1-cipher-pass) come from env via SOPS, never from this file.
[global]
repo1-type=s3
repo1-s3-endpoint=s3.eu-central-003.backblazeb2.com
repo1-s3-bucket=heymey-pg-backups
repo1-s3-region=eu-central-003
repo1-path=/production
repo1-cipher-type=aes-256-cbc
repo1-retention-full=14
repo1-retention-diff=7
process-max=4
compress-type=zst
log-level-console=info
start-fast=y

[heymey]
pg1-path=/var/lib/postgresql/data
pg1-user=heymey
