# HeyMey application stack (blueprint §21). The SAME file runs production and staging:
#   production: docker compose -p heymey         --env-file ports.env --env-file images.env --env-file ../secrets/production.env -f compose.yml up -d
#   staging:    docker compose -p heymey-staging --env-file ports.env --env-file images.env --env-file ../secrets/staging.env    -f compose.yml -f compose.staging.yml up -d
# (infra/scripts/deploy.sh wraps this.) Caddy lives in compose.edge.yml and reaches services as
# "${STACK}-<service>" on the shared `heymey-edge` network.
#
# PORT RULE: every app container LISTENS on its series port (api 4567, realtime 4568, desk 4569,
# marketing 4570, worker 4571, scheduler 4572). Nothing here is published to the internet;
# single-replica data services are published on 127.0.0.1 only, for on-box debugging.

x-app-env: &app-env
  HEYMEY_ENV: ${STACK}
  NODE_ENV: production
  DATABASE_URL: postgresql://heymey:${POSTGRES_PASSWORD}@pgbouncer:5432/heymey
  # Valkey requires a password in staging/production (SEC-M2). VALKEY_PASSWORD must be URL-safe (openssl rand -hex 32).
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in the stack secrets}@valkey:6379
  S3_ENDPOINT: http://seaweedfs:8333
  APP_VERSION: ${APP_VERSION}
  # Client IP (SEC-H1): exactly ONE trusted hop = Caddy, which overwrites X-Forwarded-For with {client_ip}
  # (CF-Connecting-IP from a Cloudflare peer only). Never "true"/all hops. Read by api and realtime.
  TRUST_PROXY_HOPS: "1"

x-app: &app
  restart: unless-stopped
  env_file: ["../secrets/${STACK}.env"]
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-node-image: &node-image ghcr.io/heymey/server:${APP_VERSION}

services:
  api:
    <<: *app
    image: *node-image
    command: ["node", "apps/api/dist/main.js"]
    environment: { <<: *app-env, PORT: "${API_PORT}" }
    networks:
      internal: {}
      edge: { aliases: ["${STACK}-api"] }
    deploy:
      replicas: 3
      resources: { limits: { cpus: "1", memory: 1536M } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${API_PORT}/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 3
    depends_on: { pgbouncer: { condition: service_started }, valkey: { condition: service_started } }

  realtime:
    <<: *app
    image: *node-image
    command: ["node", "apps/realtime/dist/main.js"]
    environment: { <<: *app-env, PORT: "${REALTIME_PORT}" }
    networks:
      internal: {}
      edge: { aliases: ["${STACK}-realtime"] }
    deploy:
      replicas: 2
      resources: { limits: { cpus: "1", memory: 1536M } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${REALTIME_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s

  worker:
    <<: *app
    image: *node-image
    command: ["node", "apps/worker/dist/main.worker.js"]
    environment: { <<: *app-env, PORT: "${WORKER_PORT}" }
    deploy:
      replicas: 2
      resources: { limits: { cpus: "1", memory: 2G } }

  scheduler:
    <<: *app
    image: *node-image
    command: ["node", "apps/worker/dist/main.scheduler.js"]
    environment: { <<: *app-env, PORT: "${SCHEDULER_PORT}" }
    deploy:
      replicas: 1 # exactly one, always
      resources: { limits: { cpus: "0.5", memory: 512M } }

  desk:
    image: ghcr.io/heymey/desk:${APP_VERSION}
    restart: unless-stopped
    networks:
      edge: { aliases: ["${STACK}-desk"] }
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }

  marketing:
    image: ghcr.io/heymey/marketing:${APP_VERSION}
    restart: unless-stopped
    environment: { PORT: "${MARKETING_PORT}", HOSTNAME: "0.0.0.0" }
    networks:
      edge: { aliases: ["${STACK}-marketing"] }
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }

  postgres:
    image: ghcr.io/heymey/postgres-pgbackrest:17 # postgres:17 + pgBackRest (infra/docker/postgres.Dockerfile)
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_USER: heymey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heymey
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    networks: [internal]
    deploy: { resources: { limits: { cpus: "6", memory: 24G } } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heymey"]
      interval: 5s

  pgbouncer:
    image: ${PGBOUNCER_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://heymey:${POSTGRES_PASSWORD}@postgres:5432/heymey
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
    ports: ["127.0.0.1:${PGBOUNCER_PORT}:5432"]
    networks: [internal]
    depends_on: { postgres: { condition: service_healthy } }

  valkey:
    image: ${VALKEY_IMAGE}
    restart: unless-stopped
    # SEC-M2: password required (VALKEY_PASSWORD from the stack's SOPS secrets). Read from the container env by the
    # shell so the value is not baked into the compose command; the apps get it via VALKEY_URL above.
    # VALKEY_MAXMEMORY must stay below the container memory limit (staging overrides both).
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in the stack secrets}
      VALKEY_MAXMEMORY: 3gb
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --maxmemory "$$VALKEY_MAXMEMORY" --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      retries: 3
    volumes: [valkey-data:/data]
    ports: ["127.0.0.1:${VALKEY_PORT}:6379"]
    networks: [internal]
    deploy: { resources: { limits: { cpus: "1", memory: 4G } } }

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    restart: unless-stopped
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweed-data:/data
      - ../secrets/${STACK}.s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:${S3_PORT}:8333"]
    networks:
      internal: {}
      edge: { aliases: ["${STACK}-seaweedfs"] }
    deploy: { resources: { limits: { cpus: "1", memory: 2G } } }

  changedetection:
    image: ${CHANGEDETECTION_IMAGE}
    restart: unless-stopped
    volumes: [changedetection-data:/datastore]
    # BOLT-0015 (blueprint §17.5, §20.2): watches official exam sites (infra/changedetection/watches.json, applied by
    # tools/changedetection-sync.mjs) and POSTs to http://api:${API_PORT}/v1/webhooks/changedetection on the
    # internal network with header x-heymey-webhook-secret = CHANGEDETECTION_WEBHOOK_SECRET (stored in the watch).
    environment:
      PORT: "${CHANGEDETECTION_PORT}"
      BASE_URL: https://ops.heymey.app/watch
      HIDE_REFERER: "true"
    # Loopback only, for tools/changedetection-sync.mjs on the server. UI is ops.heymey.app/watch.
    ports: ["127.0.0.1:${CHANGEDETECTION_PORT}:${CHANGEDETECTION_PORT}"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ['PORT'], timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks:
      internal: {}
      edge: { aliases: ["${STACK}-changedetection"] }
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }

volumes:
  pg-data:
  valkey-data:
  seaweed-data:
  changedetection-data:

networks:
  internal: {}
  edge:
    name: heymey-edge
    external: true
