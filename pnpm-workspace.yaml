packages:
  - apps/*
  - packages/*
  - dart
  - content

autoInstallPeers: true
engineStrict: true

# Supply-chain hardening (semgrep pnpm rules, BOLT-0076).
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Exact versions published without provenance that earlier releases had. Kaaval to confirm prisma@7.10.1 (BOLT-0076).
trustPolicyExclude:
  - prisma@7.10.1
  - semver@6.3.1

# Supply-chain guard: pnpm refuses packages younger than minimumReleaseAge. Entries below were
# explicitly accepted when the repo was scaffolded; remove them once those versions age past the window.

# Native builds that are allowed to run install scripts.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.9"
  - "@nestjs/common@12.2.0"
  - "@nestjs/core@12.2.0"
  - "@nestjs/platform-fastify@12.2.0"
  - "@nestjs/platform-socket.io@12.2.0"
  - "@nestjs/testing@12.2.0"
  - "@nestjs/websockets@12.2.0"
  - "@typescript-eslint/eslint-plugin@8.72.0"
  - "@typescript-eslint/parser@8.72.0"
  - "@typescript-eslint/project-service@8.72.0"
  - "@typescript-eslint/scope-manager@8.72.0"
  - "@typescript-eslint/tsconfig-utils@8.72.0"
  - "@typescript-eslint/type-utils@8.72.0"
  - "@typescript-eslint/types@8.72.0"
  - "@typescript-eslint/typescript-estree@8.72.0"
  - "@typescript-eslint/utils@8.72.0"
  - "@typescript-eslint/visitor-keys@8.72.0"
  - bullmq@6.3.18
  - dependency-cruiser@18.7.0
  - typescript-eslint@8.72.0
