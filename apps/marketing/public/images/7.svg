<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <clipPath id="sq2_clip">
      <rect width="64" height="64" rx="32" />
    </clipPath>
    <linearGradient id="sq2_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="sq2_badge" x1="18" y1="46" x2="28" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g clip-path="url(#sq2_clip)">
    <!-- Avatar Background -->
    <rect width="64" height="64" fill="url(#sq2_bg)" />

    <!-- Ambient Aura -->
    <circle cx="32" cy="28" r="22" fill="#FFFFFF" opacity="0.4" />

    <!-- Squad Member Uniform (Forest Green Aspirant Jacket) -->
    <path d="M12 64 C12 48 20 44 32 44 C44 44 52 48 52 64 Z" fill="#065F46" />
    <path d="M26 44 L32 55 L38 44" fill="#ECFDF5" />

    <!-- Golden Village Officer Star Badge on Lapel -->
    <circle cx="21" cy="50" r="4.5" fill="url(#sq2_badge)" />
    <path d="M21 47.5 L21.8 49.2 L23.5 49.5 L22.2 50.7 L22.6 52.5 L21 51.5 L19.4 52.5 L19.8 50.7 L18.5 49.5 L20.2 49.2 Z" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="28" y="34" width="8" height="12" rx="3" fill="#FBBF24" opacity="0.8" />

    <!-- Head & Face -->
    <ellipse cx="32" cy="27" rx="10.5" ry="12" fill="#FDE68A" />

    <!-- Cheeks & Smile -->
    <ellipse cx="25" cy="30" rx="1.8" ry="1.2" fill="#F87171" opacity="0.5" />
    <ellipse cx="39" cy="30" rx="1.8" ry="1.2" fill="#F87171" opacity="0.5" />
    <path d="M29 31 C30.5 33.5 33.5 33.5 35 31" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <ellipse cx="27" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <ellipse cx="37" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <circle cx="26.4" cy="25.2" r="0.6" fill="#FFFFFF" />
    <circle cx="36.4" cy="25.2" r="0.6" fill="#FFFFFF" />

    <!-- Hair (Curled Crop with Volume) -->
    <path d="M21 24 C19 15 25 11 32 11 C39 11 45 15 43 24 C43 19 39 16 32 16 C25 16 21 19 21 24 Z" fill="#27272A" />
    <!-- Wave accents -->
    <circle cx="27" cy="13" r="3.5" fill="#27272A" />
    <circle cx="35" cy="13" r="3.5" fill="#27272A" />
  </g>
</svg>