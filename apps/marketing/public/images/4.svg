<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <clipPath id="cap_clip">
      <rect width="64" height="64" rx="32" />
    </clipPath>
    <linearGradient id="cap_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2F5D7" />
      <stop offset="100%" stop-color="#8CE9B5" />
    </linearGradient>
    <linearGradient id="cap_gold" x1="20" y1="10" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g clip-path="url(#cap_clip)">
    <!-- Avatar Background -->
    <rect width="64" height="64" fill="url(#cap_bg)" />

    <!-- Ambient Study Glow -->
    <circle cx="32" cy="28" r="22" fill="#FFFFFF" opacity="0.4" />

    <!-- Squad Captain Body & Coat (Officer Navy) -->
    <path d="M12 64 C12 48 20 44 32 44 C44 44 52 48 52 64 Z" fill="#1E293B" />
    <path d="M24 44 L32 55 L40 44" fill="#FFFFFF" />
    <path d="M30 47 L32 64 L34 47 Z" fill="#D97706" />

    <!-- Golden Squad Captain Epaulette / Collar Badges -->
    <path d="M17 48 L25 45 L23 52 Z" fill="url(#cap_gold)" />
    <path d="M47 48 L39 45 L41 52 Z" fill="url(#cap_gold)" />

    <!-- Neck -->
    <rect x="28" y="34" width="8" height="12" rx="3" fill="#FBBF24" opacity="0.8" />
    <path d="M28 36 C30 40 34 40 36 36 Z" fill="#D97706" opacity="0.3" />

    <!-- Head & Face -->
    <ellipse cx="32" cy="27" rx="11" ry="12.5" fill="#FDE68A" />
    
    <!-- Cheeks & Smile -->
    <ellipse cx="25" cy="29" rx="2" ry="1.2" fill="#F87171" opacity="0.6" />
    <ellipse cx="39" cy="29" rx="2" ry="1.2" fill="#F87171" opacity="0.6" />
    <path d="M29 30 C30 33 34 33 35 30" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Eyes (Confident, friendly) -->
    <ellipse cx="27" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <ellipse cx="37" cy="26" rx="1.5" ry="2" fill="#1E293B" />
    <circle cx="26.4" cy="25.2" r="0.6" fill="#FFFFFF" />
    <circle cx="36.4" cy="25.2" r="0.6" fill="#FFFFFF" />

    <!-- Brows -->
    <path d="M25 22 C26.5 21.5 28.5 22 29 22.8" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M39 22 C37.5 21.5 35.5 22 35 22.8" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Hair (Sharp Side-Parted) -->
    <path d="M21 24 C20 16 26 12 33 12 C40 12 44 15 44 21 C44 24 43 25 42 27 C40 20 37 17 31 17 C26 17 22 20 21 24 Z" fill="#0F172A" />

    <!-- HeyMey Captain Gold Crest (Diya Crown Emblem) -->
    <g transform="translate(32, 11)">
      <!-- Gold Star Pin -->
      <path d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z" fill="url(#cap_gold)" />
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>