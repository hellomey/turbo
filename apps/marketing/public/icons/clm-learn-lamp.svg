<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Cyan/Blue Lit Halo -->
    <linearGradient id="clm_learn_halo" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="clm_learn_body" x1="30" y1="50" x2="90" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="clm_learn_flame" x1="60" y1="18" x2="60" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#BAE6FD" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="clm_learn_shadow" x="20" y="15" width="80" height="95" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0369A1" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="60" cy="55" r="42" fill="#BAE6FD" opacity="0.4" filter="blur(10px)" />
  
  <!-- Orbiting "Lit" Ring of HeyMey -->
  <ellipse cx="60" cy="58" rx="46" ry="22" stroke="url(#clm_learn_halo)" stroke-width="2" stroke-dasharray="4 3" opacity="0.85" />
  
  <g filter="url(#clm_learn_shadow)">
    <!-- Base Pedestal -->
    <ellipse cx="60" cy="98" rx="20" ry="6" fill="#075985" />
    <path d="M46 94 C46 90 52 89 60 89 C68 89 74 90 74 94 L71 97 C71 99 49 99 49 97 Z" fill="url(#clm_learn_body)" />
    
    <!-- Central Stem -->
    <rect x="56.5" y="82" width="7" height="8" rx="2" fill="#0369A1" />
    <rect x="58" y="82" width="4" height="8" rx="1" fill="#7DD3FC" />

    <!-- Diya Bowl -->
    <path d="M30 70 C30 84 44 90 60 90 C76 90 90 84 90 70 C90 64 76 65 60 65 C44 65 30 64 30 70 Z" fill="url(#clm_learn_body)" />
    
    <!-- Diya Rim -->
    <ellipse cx="60" cy="69" rx="28" ry="8.5" fill="#075985" />
    <ellipse cx="60" cy="68.5" rx="25" ry="6.5" fill="#E0F2FE" opacity="0.9" />
    <ellipse cx="60" cy="69" rx="21" ry="5" fill="#0284C7" />

    <!-- Pure Lit Flame -->
    <!-- Outer Cyan Flame Aura -->
    <path d="M60 22 C49 38 45 50 50 62 C53 68 67 68 70 62 C75 50 71 38 60 22 Z" fill="url(#clm_learn_flame)" />
    
    <!-- Inner Radiant Core Flame -->
    <path d="M60 32 C54 44 52 52 55 60 C57 63 63 63 65 60 C68 52 66 44 60 32 Z" fill="#FFFFFF" />
    <circle cx="60" cy="53" r="3" fill="#E0F2FE" />

    <!-- Medallion -->
    <circle cx="60" cy="80" r="3.5" fill="#E0F2FE" />
    <circle cx="60" cy="80" r="1.8" fill="#0284C7" />
  </g>

  <!-- Sparkles -->
  <path d="M96 35 L97.5 39 L101.5 40.5 L97.5 42 L96 46 L94.5 42 L90.5 40.5 L94.5 39 Z" fill="#38BDF8" />
  <circle cx="100" cy="54" r="1.8" fill="#FFFFFF" />
  <path d="M24 45 L25 47.5 L27.5 48.5 L25 49.5 L24 52 L23 49.5 L20.5 48.5 L23 47.5 Z" fill="#FFFFFF" />
  <circle cx="22" cy="36" r="1.8" fill="#38BDF8" />
</svg>
