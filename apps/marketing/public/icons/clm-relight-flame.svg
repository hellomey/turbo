<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Relight Amber Flame Gradient -->
    <linearGradient id="clm_relight_flame" x1="60" y1="15" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <!-- Orbiting Revision Arc Gradient -->
    <linearGradient id="clm_orbit_arc" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="clm_relight_shadow" x="20" y="10" width="80" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#B45309" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient Warm Glow -->
  <circle cx="60" cy="55" r="44" fill="#FEF08A" opacity="0.4" filter="blur(12px)" />

  <!-- Circular Spaced Revision Timer Orbit Arc (Relight Orbit) -->
  <path d="M98 55 C98 76 81 93 60 93 C39 93 22 76 22 55 C22 34 39 17 60 17 C72 17 83 23 89 32" stroke="url(#clm_orbit_arc)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" />
  <!-- Arrowhead of Relight Loop -->
  <path d="M86 26 L93 33 L85 38 Z" fill="#F59E0B" />

  <!-- Main 3D Relight Sacred Flame -->
  <g filter="url(#clm_relight_shadow)">
    <!-- Outer Blazing Flame Silhouette -->
    <path d="M60 16 C48 34 40 48 46 68 C50 82 70 82 74 68 C80 48 72 34 60 16 Z" fill="url(#clm_relight_flame)" />
    
    <!-- Secondary Dynamic Fire Tongue -->
    <path d="M48 64 C44 52 48 42 54 36 C52 44 56 48 54 58 C53 62 50 64 48 64 Z" fill="#FBBF24" opacity="0.85" />
    <path d="M72 64 C76 52 72 42 66 36 C68 44 64 48 66 58 C67 62 70 64 72 64 Z" fill="#FBBF24" opacity="0.85" />

    <!-- Radiant Inner Core Flame -->
    <path d="M60 30 C53 44 50 54 54 66 C56 72 64 72 66 66 C70 54 67 44 60 30 Z" fill="#FFFBEB" />
    
    <!-- Pure White Hot Core Spark -->
    <circle cx="60" cy="58" r="4.5" fill="#FFFFFF" />

    <!-- Traditional Brass Oil Base Dish -->
    <path d="M42 80 C42 88 50 91 60 91 C70 91 78 88 78 80 Z" fill="#92400E" />
    <ellipse cx="60" cy="80" rx="18" ry="4" fill="#F59E0B" />
    <ellipse cx="60" cy="80" rx="14" ry="2.5" fill="#FEF08A" />
  </g>

  <!-- Relight Sparks -->
  <path d="M30 32 L31.5 35 L34.5 36.5 L31.5 38 L30 41 L28.5 38 L25.5 36.5 L28.5 35 Z" fill="#F59E0B" />
  <circle cx="28" cy="24" r="2" fill="#FFFFFF" />
  <path d="M90 68 L91.5 71 L94.5 72.5 L91.5 74 L90 77 L88.5 74 L85.5 72.5 L88.5 71 Z" fill="#F59E0B" />
  <circle cx="94" cy="58" r="1.8" fill="#FFFFFF" />
</svg>
