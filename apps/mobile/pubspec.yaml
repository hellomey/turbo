name: heymey_mobile
description: HeyMey mobile app (Android + iOS). Every user lives here. No web build for aspirants.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  hm_design:
    path: ../../dart/hm_design
  hm_core:
    path: ../../dart/hm_core
  hm_data:
    path: ../../dart/hm_data
  hm_games:
    path: ../../dart/hm_games
  hm_features:
    path: ../../dart/hm_features
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  # NEVER add hm_desk here. Desk-only code is never in the mobile build (blueprint §35).

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
